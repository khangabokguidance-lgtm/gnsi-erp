<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body>
<title>JNV Practice Set 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&display=swap">
<style>
/* Layout: printed exam sheets on a desk; library of sets, paper + docked OMR sheet, and a two-pane set maker with live preview */
:root {
  --desk: #dde5e2;
  --paper: #fbfcfa;
  --ink: #142120;
  --muted: #5a6c68;
  --rule: #cbd6d2;
  --tint: #e9f0ee;
  --brand: #0e4f4b;
  --on-brand: #f3faf8;
  --gold: #c98a14;
  --piece: #b9d6d0;
  --good: #23784a;
  --bad: #b23c26;
  --scrim: rgba(12, 26, 24, .45);
  --shadow: 0 1px 2px rgba(14, 40, 38, .08), 0 12px 32px -12px rgba(14, 40, 38, .22);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1110; --paper: #151f1e; --ink: #e2ebe8; --muted: #93a6a1; --rule: #2a3936;
    --tint: #1d2b29; --brand: #5db5aa; --on-brand: #0b1110; --gold: #e6ac47; --piece: #2f5953;
    --good: #6cc58f; --bad: #ec7f66; --scrim: rgba(0, 0, 0, .62); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1110; --paper: #151f1e; --ink: #e2ebe8; --muted: #93a6a1; --rule: #2a3936;
  --tint: #1d2b29; --brand: #5db5aa; --on-brand: #0b1110; --gold: #e6ac47; --piece: #2f5953;
  --good: #6cc58f; --bad: #ec7f66; --scrim: rgba(0, 0, 0, .62); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--desk); color: var(--ink); font-family: var(--f-body);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
a { color: var(--brand); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.bar-in {
  max-width: 1360px; margin: 0 auto; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; min-height: 58px;
}
.brandmark { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; text-decoration: none; color: var(--ink); min-width: 0; }
.brandmark .dot { flex: none; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.brandmark small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.bar-stats { display: flex; align-items: center; gap: 10px 16px; margin-left: auto; flex-wrap: wrap; }
.stat { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.stat b { color: var(--ink); font-weight: 600; font-size: 14px; }
.meter { width: 90px; height: 5px; border-radius: 3px; background: var(--tint); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .25s ease; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--rule); background: var(--paper); border-radius: 999px;
  padding: 6px 14px; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .02em; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--brand); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1a1405; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.chipnote { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 3px 9px; border: 1px dashed var(--rule); border-radius: 999px; }

/* ---------- page layout ---------- */
.wrap {
  max-width: 1360px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
@media (min-width: 1140px) { .wrap.take { grid-template-columns: minmax(0, 1fr) 280px; align-items: start; } }
.sheets { display: grid; gap: 28px; min-width: 0; container-type: inline-size; }

.sheet {
  position: relative; background: var(--paper); border-radius: 4px; box-shadow: var(--shadow);
  padding: clamp(18px, 3.4vw, 44px) clamp(16px, 3.4vw, 44px) 28px clamp(16px, 4.4vw, 60px); min-width: 0;
}
.sheet::before { content: ""; position: absolute; top: 18px; bottom: 18px; left: 20px; border-left: 1.5px dashed var(--rule); }
.sheet .scissor { position: absolute; left: 12px; width: 17px; height: 17px; color: var(--muted); background: var(--paper); }
@container (max-width: 600px) { .sheet::before, .sheet .scissor { display: none; } }

.runhead {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  padding-bottom: 10px; margin-bottom: 22px; border-bottom: 2px solid var(--ink);
}
.runhead .pg { background: var(--ink); color: var(--paper); padding: 2px 10px; border-radius: 2px; letter-spacing: .04em; font-weight: 600; white-space: nowrap; }

/* ---------- masthead ---------- */
.mast { display: grid; gap: 22px; align-items: center; grid-template-columns: auto 1fr; padding-bottom: 26px; border-bottom: 1px solid var(--rule); margin-bottom: 26px; }
.medal { width: 132px; height: 132px; }
.medal .ring { fill: none; stroke: var(--gold); stroke-width: 2; }
.medal .disc { fill: var(--brand); }
.medal .num { fill: var(--on-brand); font-family: var(--f-display); font-weight: 800; }
.medal .rib { fill: var(--gold); }
.medal .ribtxt { fill: #1a1405; font-family: var(--f-mono); font-weight: 600; font-size: 9.5px; letter-spacing: .14em; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.mast h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 4.6vw, 50px); line-height: 1; letter-spacing: -.025em; margin: 8px 0 6px; text-wrap: balance; overflow-wrap: anywhere; }
.mast h1 span { color: var(--brand); }
.mast .sub { font-family: var(--f-display); font-weight: 500; font-size: clamp(16px, 2vw, 20px); color: var(--muted); margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.facts span { font-family: var(--f-mono); font-size: 11.5px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 999px; color: var(--muted); }
.facts span b { color: var(--ink); font-weight: 600; }
@container (max-width: 560px) { .mast { grid-template-columns: 1fr; } .medal { width: 104px; height: 104px; } }

.instructions { font-size: 13.5px; color: var(--muted); display: grid; gap: 4px; margin: 0 0 8px; padding-left: 18px; }
.instructions li::marker { color: var(--gold); }

/* ---------- section bands, parts, directions ---------- */
.band { margin: 8px 0 18px; }
.band .tag { display: flex; align-items: center; justify-content: center; background: var(--brand); color: var(--on-brand); font-family: var(--f-mono); font-weight: 600; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; padding: 5px 12px; border-radius: 2px; }
.band h2 { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: clamp(17px, 2.3vw, 22px); letter-spacing: .02em; text-transform: uppercase; margin: 10px 0; text-wrap: balance; }
.band .dir { border: 1.5px solid var(--ink); padding: 10px 14px; font-style: italic; }
.dir { font-size: 13.5px; line-height: 1.55; margin: 0 0 14px; }
.dir b, .dir strong { font-style: normal; font-variant: small-caps; letter-spacing: .04em; font-weight: 700; }

.cols { column-gap: 44px; }
@container (min-width: 720px) { .cols { columns: 2; column-rule: 1px solid var(--rule); } }

.subhead { break-inside: avoid; break-after: avoid; display: inline-block; margin: 4px 0 14px; padding: 6px 16px 6px 12px; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .02em; text-transform: uppercase; background: var(--tint); border-left: 4px solid var(--gold); }
.part { break-inside: avoid; break-after: avoid; display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
.part::before, .part::after { content: ""; flex: 1; height: 7px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px); opacity: .55; }
.lead { break-inside: avoid; }
.emptysec { color: var(--muted); font-style: italic; text-align: center; padding: 24px 0; margin: 0; }

/* ---------- questions ---------- */
.q { break-inside: avoid; padding: 2px 0 16px; scroll-margin-top: 80px; }
.qhead { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: baseline; }
.qn { font-family: var(--f-display); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.qtext { font-size: 15px; overflow-wrap: anywhere; }
.cap { font-family: var(--f-display); font-weight: 700; font-size: 13px; margin: 6px 0 6px 30px; }
.qfig { margin-left: 30px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.qimg { display: block; max-width: 100%; max-height: 220px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; }
.imgph { width: 120px; height: 80px; display: grid; place-items: center; border: 1.5px dashed var(--rule); color: var(--muted); font-family: var(--f-mono); font-size: 10.5px; border-radius: 3px; text-align: center; }

svg.fig { display: block; stroke: var(--ink); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; overflow: hidden; }
svg.fig .frame { stroke-width: 1.6; fill: var(--paper); }
svg.fig .k { fill: var(--ink); }
svg.fig .pc { fill: var(--piece); stroke-width: 1.8; }
svg.fig .hh { stroke-width: 2.6; }
svg.fig .thin { stroke-width: .9; }
svg.fig text { fill: var(--ink); stroke: none; font-family: var(--f-body); }
svg.fig .qm { font-size: 18px; font-weight: 600; }
svg.fig .lbl { font-size: 7px; font-weight: 700; }
.qfig svg.fig { width: 64px; height: 64px; }
.qfig svg.fig.big { width: 118px; height: 118px; }
.qfig svg.fig.mq { width: 88px; height: 67px; }

.opts { margin-left: 30px; display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 2px 10px; margin-top: 4px; }
@container (max-width: 420px) { .opts { --n: 2 !important; } .opts.long { --n: 1 !important; } }
.opt { display: flex; align-items: flex-start; gap: 8px; text-align: left; cursor: pointer; background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; min-width: 0; transition: background .15s, border-color .15s; }
.opt:hover { background: var(--tint); }
.bub { flex: none; width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; color: var(--muted); margin-top: 1px; transition: background .15s, color .15s, border-color .15s; }
.ot { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-pressed="true"] { background: var(--tint); border-color: color-mix(in srgb, var(--brand) 45%, transparent); }
.opt[aria-pressed="true"] .bub { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.figopts { grid-template-columns: repeat(4, minmax(0, 64px)); gap: 6px 12px; }
.figopts .opt { flex-direction: column; align-items: center; gap: 4px; padding: 4px; }
.figopts svg.fig { width: 52px; height: 52px; }
.figopts img { width: 52px; height: 52px; object-fit: contain; border: 1px solid var(--rule); background: #fff; border-radius: 2px; }

.checked .opt { cursor: default; }
.checked .opt.is-right .bub, .preview .opt.is-key .bub { background: var(--good); border-color: var(--good); color: var(--paper); }
.checked .opt.is-right { border-color: color-mix(in srgb, var(--good) 55%, transparent); }
.checked .opt.is-wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.checked .opt.is-wrong .ot { text-decoration: line-through; text-decoration-color: var(--bad); }
.checked .opt.is-wrong { border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: transparent; }
.preview .opt { cursor: default; }
.preview .opt:hover { background: none; }

.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .82em; line-height: 1.05; margin: 0 1px; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
.passage { break-inside: avoid; margin-bottom: 16px; }
.passage h3 { font-family: var(--f-display); font-weight: 700; text-align: center; font-size: 16px; margin: 4px 0 8px; }
.passage p { margin: 0 0 8px; text-indent: 1.5em; font-size: 14.5px; }
.picto { width: 100%; border-collapse: collapse; margin: 8px 0 6px; font-size: 13.5px; }
.picto th { text-align: left; font-family: var(--f-display); font-weight: 700; padding: 5px 8px; border: 1px solid var(--ink); width: 34%; }
.picto td { padding: 5px 8px; border: 1px solid var(--ink); }
.smile { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-right: 3px; color: var(--gold); }
.endmark { text-align: right; font-family: var(--f-mono); color: var(--muted); letter-spacing: .3em; margin-top: 4px; }

/* ---------- OMR answer sheet ---------- */
.omr { background: var(--paper); border-radius: 4px; box-shadow: var(--shadow); padding: 18px 16px 20px; position: relative; min-width: 0; }
@media (min-width: 1140px) { .omr { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); max-height: calc(100vh - 96px); overflow-y: auto; } }
.omr h2 { font-family: var(--f-display); font-weight: 800; font-size: 18px; margin: 0; letter-spacing: -.01em; }
.hint { font-size: 12.5px; color: var(--muted); margin: 4px 0 14px; }
.omr-sec { margin-top: 14px; }
.omr-sec h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.omr-sec h3 b { color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; }
.omr-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 12px; }
@media (min-width: 640px) and (max-width: 1139px) { .omr-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.orow { display: flex; align-items: center; gap: 3px; }
.oq { width: 22px; padding: 0; border: 0; background: none; text-align: left; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.oq:hover { color: var(--brand); }
.ob { width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--muted); background: none; padding: 0; font-family: var(--f-mono); font-size: 8.5px; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.ob.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.checked .ob.key { box-shadow: 0 0 0 2px var(--good); }
.checked .ob.on.miss { background: var(--bad); border-color: var(--bad); }
.checked .ob.on.key { background: var(--good); border-color: var(--good); }
.score { display: none; margin-bottom: 4px; padding: 14px; border-radius: 4px; background: var(--tint); }
.checked .score { display: block; }
.score .big { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 16px; color: var(--muted); font-weight: 600; }
.score ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.score li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.score li b { color: var(--ink); font-variant-numeric: tabular-nums; }
.score li .meter { grid-column: 1 / -1; width: 100%; background: var(--paper); }
.score li .meter i { background: var(--good); }
.omr-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- library ---------- */
.lib { display: grid; gap: 24px; }
.lib-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.lib-head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 5vw, 52px); line-height: 1; letter-spacing: -.03em; margin: 8px 0 8px; }
.lib-head p { margin: 0; color: var(--muted); max-width: 60ch; }
.cards { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card { background: var(--paper); border-radius: 4px; box-shadow: var(--shadow); padding: 18px 18px 16px; display: grid; gap: 12px; align-content: start; border-top: 4px solid var(--brand); min-width: 0; }
.card.builtin { border-top-color: var(--gold); }
.card-top { display: flex; gap: 14px; align-items: center; }
.card .medal { width: 64px; height: 64px; flex: none; }
.card h2 { font-family: var(--f-display); font-weight: 800; font-size: 19px; line-height: 1.15; margin: 2px 0 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
.card .meta { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.card .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.card.empty { border-top-color: var(--rule); box-shadow: none; border: 1.5px dashed var(--rule); background: transparent; color: var(--muted); }
.card.empty h2 { color: var(--ink); }
.eyebrow.sm { font-size: 10.5px; }

/* ---------- maker ---------- */
.mk { display: grid; gap: 24px; }
@media (min-width: 1200px) { .mk { grid-template-columns: minmax(0, 600px) minmax(0, 1fr); align-items: start; } }
.mk-tabs { display: flex; gap: 6px; }
@media (min-width: 1200px) { .mk > .mk-tabs { display: none; } .mk > .mk-pane[hidden] { display: block !important; } }
.mk-prev { min-width: 0; }
@media (min-width: 1200px) { .mk-prev { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); max-height: calc(100vh - 96px); overflow-y: auto; padding: 0 4px 12px; } }
.prevlabel { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.panel { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-family: var(--f-display); font-weight: 800; font-size: 17px; margin: 0; letter-spacing: -.01em; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.mk-edit { display: grid; gap: 18px; min-width: 0; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld > span { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.in { width: 100%; min-width: 0; border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 8px 10px; font-size: 14.5px; line-height: 1.45; }
textarea.in { resize: vertical; min-height: 62px; }
.in:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-family: var(--f-mono); font-size: 11.5px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

<script>
(() => {
/* ---------- SVG primitives ---------- */
let uid = 0;
const L = (a, b, c, d, k = '') => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"${k ? ` class="${k}"` : ''}/>`;
const R = (x, y, w, h, k = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}"${k ? ` class="${k}"` : ''}/>`;
const C = (x, y, r, k = '') => `<circle cx="${x}" cy="${y}" r="${r}"${k ? ` class="${k}"` : ''}/>`;
const pts = p => p.map(q => q.map(n => +n.toFixed(2)).join(',')).join(' ');
const P = (p, k = '') => `<polygon points="${pts(p)}"${k ? ` class="${k}"` : ''}/>`;
const PL = p => `<polyline points="${pts(p)}"/>`;
const ngon = (cx, cy, r, n, start = -90) => Array.from({ length: n }, (_, i) => {
  const a = (start + i * 360 / n) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
});
const QM = (x, y) => `<text x="${x}" y="${y}" class="qm" text-anchor="middle" dominant-baseline="central">?</text>`;
const svg = (inner, w = 60, h = 60, k = '') => `<svg viewBox="0 0 ${w} ${h}" class="fig ${k}" aria-hidden="true">${inner}</svg>`;
const frame = (w = 60, h = 60) => R(1, 1, w - 2, h - 2, 'frame');
const box = inner => svg(frame() + inner);
const grid = inner => svg(frame(100, 100) + inner + L(50, 1, 50, 99) + L(1, 50, 99, 50), 100, 100, 'big');
const T = { m: 'translate(60 0) scale(-1 1)', v: 'translate(0 60) scale(1 -1)', r: 'rotate(180 30 30)', o: '' };
const tf = (t, g) => `<g transform="${T[t]}">${g}</g>`;
const mirrorQ = inner => {
  let hatch = '';
  for (let y = 10; y <= 56; y += 3.2) hatch += L(70, y, 74, y - 2.6, 'thin');
  return svg(`<g transform="translate(0 3)">${frame()}${inner}</g>` + L(70, 8, 70, 58) + hatch +
    `<text x="70" y="5.5" class="lbl" text-anchor="middle">X</text><text x="70" y="66" class="lbl" text-anchor="middle">Y</text>`, 84, 67, 'mq');
};

/* Part I */
const p1 = (o, y, s) => [.25, .5, .75].map(f => L(o + s * f, y, o + s * f, y + s)).join('');
const p2 = (o, y, s) => L(o + s * .3, y, o + s * .3, y + s) + L(o + s * .7, y, o + s * .7, y + s) + L(o + s * .3, y + s * .5, o + s * .7, y + s * .5);
const xq = (o, y, s, pos) => {
  const m = { t: [.5, .2], r: [.8, .5], b: [.5, .8], l: [.2, .5] }[pos];
  return L(o, y, o + s, y + s) + L(o + s, y, o, y + s) + C(o + s * m[0], y + s * m[1], s * .075);
};
const dots = (o, y, s, list) => list.map(([c, r]) => C(o + s * (.22 + .28 * c), y + s * (.22 + .28 * r), s * .085, 'k')).join('');
const dq = (o, y, s, t) => {
  const d = { a: [0, [.3, .3]], b: [1, [.7, .3]], c: [1, [.3, .7]], d: [0, [.7, .7]], e: [0, [.7, .3]] }[t];
  const diag = d[0] ? L(o + s, y, o, y + s) : L(o, y, o + s, y + s);
  return diag + C(o + s * d[1][0], y + s * d[1][1], s * .17) + L(o + s * d[1][0] - s * .17, y + s * d[1][1], o + s * d[1][0] + s * .17, y + s * d[1][1]);
};
/* Part II */
const q5g = R(20, 20, 20, 20) + L(40, 20, 50, 10) + C(50, 10, 2.4, 'k') + L(30, 40, 30, 49) + P([[26, 47], [34, 47], [30, 54]], 'k');
const rot = a => `<g transform="rotate(${a} 30 30)">${q5g}</g>`;
const shape = (t, cx, cy, s) => ({
  sq: () => R(cx - s / 2, cy - s / 2, s, s),
  ci: () => C(cx, cy, s / 2),
  tri: () => P([[cx - s / 2, cy - s / 2], [cx - s / 2, cy + s / 2], [cx + s / 2, cy + s / 2]]),
  pent: () => P(ngon(cx, cy, s / 2, 5)),
})[t]();
const nest = list => {
  let cx = 30, cy = 30, s = 46, out = '';
  list.forEach(t => {
    out += shape(t, cx, cy, s);
    if (t === 'tri') { const r = .2929 * s; cx = cx - s / 2 + r; cy = cy + s / 2 - r; s = 2 * r * .78; }
    else s *= t === 'pent' ? .58 : .64;
  });
  return out;
};
const q7 = left => left + C(43, 30, 7.5, 'k');
const corner = { tr: [51, 9], br: [51, 51], bl: [9, 51], tl: [9, 9] };
const q8 = (g, c) => g + C(...corner[c], 2.6, 'k');
/* Part III */
const top = p => P([[8, 8], [52, 8], ...p.slice().reverse()], 'pc');
const bot = p => P([...p, [52, 52], [8, 52]], 'pc');
const circPiece = (p, side) => {
  const poly = side === 'l' ? [[0, 0], ...p, [0, 60]] : [...p, [60, 60], [60, 0]];
  const a = 'cc' + (++uid), b = 'cp' + uid;
  return `<defs><clipPath id="${a}"><circle cx="30" cy="30" r="22"/></clipPath><clipPath id="${b}">${P(poly)}</clipPath></defs>` +
    `<g clip-path="url(#${a})">${P(poly, 'pc')}</g><g clip-path="url(#${b})">${C(30, 30, 22)}</g>`;
};
/* Part IV */
const hand = (deg, len, k = '') => { const a = deg * Math.PI / 180; return L(30, 30, +(30 + len * Math.sin(a)).toFixed(2), +(30 - len * Math.cos(a)).toFixed(2), k); };
const clock = (h, m) => {
  let t = C(30, 30, 21);
  for (let i = 0; i < 12; i++) { const a = i * 30 * Math.PI / 180, r1 = i % 3 ? 18.5 : 16.5; t += L(+(30 + r1 * Math.sin(a)).toFixed(2), +(30 - r1 * Math.cos(a)).toFixed(2), +(30 + 20 * Math.sin(a)).toFixed(2), +(30 - 20 * Math.cos(a)).toFixed(2), 'thin'); }
  return t + hand(h, 10.5, 'hh') + hand(m, 16) + C(30, 30, 1.6, 'k');
};
const g14 = P([[30, 5], [55, 30], [30, 55], [5, 30]]) + R(13, 26, 8, 8, 'k') +
  R(26, 12, 8, 8) + L(28, 12, 28, 20, 'thin') + L(30, 12, 30, 20, 'thin') + L(32, 12, 32, 20, 'thin') +
  C(41, 29, 3) + P([[27, 39], [35, 39], [27, 47]], 'k');
const g15 = `<path d="M7,19 A10,9 0 0 1 27,19 Z" class="k"/>` + L(17, 19, 17, 27) + `<path d="M17,27 q0,3 -3,3"/>` +
  C(39, 15, 4, 'k') + C(45, 13, 5, 'k') + C(50, 16, 3.5, 'k') + R(39, 14, 11, 5.5, 'k') +
  L(38, 23, 36, 27) + L(43, 23, 41, 27) + L(48, 23, 46, 27) +
  C(17, 44, 4.5, 'k') + [0, 45, 90, 135, 180, 225, 270, 315].map(d => { const a = d * Math.PI / 180; return L(+(17 + 7 * Math.cos(a)).toFixed(2), +(44 + 7 * Math.sin(a)).toFixed(2), +(17 + 10 * Math.cos(a)).toFixed(2), +(44 + 10 * Math.sin(a)).toFixed(2)); }).join('') +
  L(39, 36, 39, 54) + P([[39, 36], [52, 40], [39, 44]], 'k');
const g16 = `<path d="M30,12 A20,20 0 1 1 10,32 L30,32 Z"/>` +
  L(38, 19, 38, 27) + L(34.5, 21, 41.5, 25) + L(34.5, 25, 41.5, 21) +
  C(21, 41, 4) + L(18, 44, 24, 38) +
  C(38, 41, 2.6, 'k') + [0, 60, 120, 180, 240, 300].map(d => { const a = d * Math.PI / 180; return L(+(38 + 4 * Math.cos(a)).toFixed(2), +(41 + 4 * Math.sin(a)).toFixed(2), +(38 + 6 * Math.cos(a)).toFixed(2), +(41 + 6 * Math.sin(a)).toFixed(2)); }).join('');

/* ---------- helpers for text ---------- */
const f = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const smile = '<svg class="smile" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.6" cy="6.4" r="1" fill="currentColor"/><circle cx="10.4" cy="6.4" r="1" fill="currentColor"/><path d="M4.8 9.6 Q8 12.6 11.2 9.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
const smiles = n => smile.repeat(n);

/* ---------- question bank (answer index: A=0 … D=3) ---------- */
const fig = (n, qf, opts, a, label = 'Question Figure', aLabel = 'Answer Figures') => ({ n, kind: 'fig', qf, opts, a, label, aLabel });
const tx = (n, q, opts, a) => ({ n, kind: 'text', q, opts, a });

const v9 = [[8, 30], [18, 24], [24, 34], [32, 22], [40, 32], [52, 26]];
const v10 = [[8, 26], [14, 14], [19, 26], [25, 12], [30, 26], [36, 15], [41, 27], [52, 22]];
const v11 = [[30, 0], [27, 14], [35, 22], [24, 32], [33, 42], [30, 60]];
const v12 = [[8, 32], [15, 32], [15, 20], [22, 20], [22, 34], [29, 34], [29, 22], [37, 22], [37, 30], [44, 30], [44, 24], [52, 24]];

const PAPER = [
  { sheet: 1, band: { tag: 'Section 1', title: 'Mental Ability Test (MAT) and Environmental Studies (EVS)',
      dir: '<b>Directions:</b> This is a non-verbal test. Questions are based on figures and diagrams only. Questions are meant to assess General Mental Ability / Functioning of the candidates. The section is divided into five parts having 4 questions each from Mental Ability and remaining 20 questions are from Environmental Studies.' },
    blocks: [
      { sub: 'Mental Ability Test (MAT)', part: 'Part – I',
        dir: '<b>Directions:</b> In Question Nos. <b>1</b> to <b>4</b>, there is a question figure, a part of which is missing. Observe the answer figures (A), (B), (C) and (D) and find out the answer figure which, without changing the direction, fits in the missing part of the question figure in order to complete the pattern in the question figure.',
        qs: [
          fig(1, [grid(p2(50, 0, 50) + p2(0, 50, 50) + p1(50, 50, 50) + QM(25, 25))],
            [p1(0, 0, 60), L(30, 0, 30, 60) + L(30, 30, 60, 0), p2(0, 0, 60), L(20, 0, 20, 60) + L(40, 0, 40, 60) + L(20, 60, 40, 0)].map(box), 0),
          fig(2, [grid(xq(0, 0, 50, 't') + xq(50, 0, 50, 'r') + xq(0, 50, 50, 'l') + QM(75, 75))],
            [xq(0, 0, 60, 'b') + L(10, 0, 10, 60), xq(0, 0, 60, 'b'), xq(0, 0, 60, 'r'), xq(0, 0, 60, 't')].map(box), 1),
          fig(3, [grid(dots(0, 0, 50, [[1, 0], [0, 2], [1, 2]]) + dots(50, 0, 50, [[1, 0], [2, 2], [1, 2]]) + dots(0, 50, 50, [[0, 0], [1, 0], [1, 2]]) + QM(75, 75))],
            [[[0, 0], [1, 0], [1, 2]], [[2, 0], [0, 2], [2, 2]], [[2, 0], [1, 0], [1, 2]], [[0, 0], [0, 2], [2, 2]]].map(d => box(dots(0, 0, 60, d))), 2),
          fig(4, [grid(dq(0, 0, 50, 'a') + dq(0, 50, 50, 'c') + dq(50, 50, 50, 'd') + QM(75, 25))],
            ['e', 'b', 'c', 'a'].map(t => box(dq(0, 0, 60, t))), 1),
        ] },
      { part: 'Part – II',
        dir: '<b>Directions:</b> In Question Nos. <b>5</b> to <b>8</b>, there are three question figures and the space for the fourth figure is left blank. The question figures are in a series. Find out one figure among the answer figures (A), (B), (C) and (D) which occupies the blank space for the fourth figure to complete the series.',
        qs: [
          fig(5, [box(rot(0)), box(rot(90)), box(rot(180)), box(QM(30, 30))],
            [tf('m', rot(270)), rot(0), rot(270), rot(90)].map(box), 2, 'Question Figures'),
          fig(6, [box(nest(['sq', 'ci', 'tri'])), box(nest(['tri', 'sq', 'ci'])), box(nest(['ci', 'tri', 'sq'])), box(QM(30, 30))],
            [['ci', 'ci', 'pent'], ['sq', 'ci', 'ci'], ['sq', 'ci', 'tri'], ['ci', 'sq', 'ci']].map(l => box(nest(l))), 2, 'Question Figures'),
          fig(7, [box(q7(P(ngon(19, 32, 10, 3), 'k'))), box(q7(P(ngon(19, 30, 9.5, 4, -45), 'k'))), box(q7(P(ngon(19, 31, 9.5, 5), 'k'))), box(QM(30, 30))],
            [P([[14, 25], [24, 25], [27, 36], [11, 36]], 'k'), P(ngon(19, 30, 9, 4), 'k'), C(19, 30, 7.5, 'k'), P(ngon(19, 30, 9, 6, 0), 'k')].map(s => box(q7(s))), 3, 'Question Figures'),
          fig(8, [box(q8(P(ngon(30, 30, 16, 6, 0)), 'tr')), box(q8(P(ngon(30, 31, 16, 5)), 'br')), box(q8(R(16, 22, 28, 16), 'bl')), box(QM(30, 30))],
            [q8(C(30, 30, 15), 'tl'), q8(P(ngon(30, 33, 17, 3)), 'bl'), q8(P(ngon(30, 33, 17, 3)), 'tl'), q8(P(ngon(30, 33, 17, 3)), 'tr')].map(box), 2, 'Question Figures'),
        ] },
      { part: 'Part – III',
        dir: '<b>Directions:</b> In Question Nos. <b>9</b> to <b>12</b>, one part of a geometrical figure (triangle, square, circle) is given as question figure and the other one is among the four answer figures (A), (B), (C) and (D). Find the figure that completes the geometrical figure.',
        qs: [
          fig(9, [box(bot(v9))],
            [[[8, 30], [18, 36], [24, 26], [32, 38], [40, 28], [52, 26]], v9, [[8, 26], [20, 24], [28, 34], [36, 22], [44, 30], [52, 30]], [[8, 30], [16, 22], [26, 34], [34, 22], [42, 34], [52, 26]]].map(p => box(top(p))), 1),
          fig(10, [box(bot(v10))],
            [[[8, 26], [14, 16], [20, 26], [27, 16], [34, 27], [52, 22]], [[8, 24], [13, 30], [19, 16], [25, 30], [31, 16], [38, 30], [52, 24]], v10, [[8, 26], [14, 14], [19, 26], [25, 12], [30, 26], [52, 26]]].map(p => box(top(p))), 2),
          fig(11, [box(circPiece(v11, 'l'))],
            [v11, [[30, 0], [33, 14], [25, 22], [36, 32], [27, 42], [30, 60]], [[30, 0], [27, 14], [35, 24], [30, 40], [30, 60]], [[30, 0], [24, 16], [36, 26], [24, 38], [33, 48], [30, 60]]].map(p => box(circPiece(p, 'r'))), 0),
          fig(12, [box(bot(v12))],
            [[[8, 32], [15, 32], [15, 22], [22, 22], [22, 32], [29, 32], [29, 22], [37, 22], [37, 32], [52, 32]], [[8, 24], [18, 24], [18, 36], [42, 36], [42, 24], [52, 24]], [[8, 32], [15, 32], [15, 18], [22, 32], [29, 20], [37, 34], [44, 22], [52, 24]], v12].map(p => box(top(p))), 3),
        ] },
      { part: 'Part – IV',
        dir: '<b>Directions:</b> In Question Nos. <b>13</b> to <b>16</b>, there is a question figure given and four answer figures marked (A), (B), (C) and (D) are given. Select the answer figure which is exactly the mirror image of the question figure when the mirror is held at XY.',
        qs: [
          fig(13, [mirrorQ(clock(125, 60))], [clock(125, 60), clock(235, 300), clock(300, 235), clock(305, 240)].map(box), 1),
          fig(14, [mirrorQ(g14)], ['m', 'o', 'v', 'r'].map(t => box(tf(t, g14))), 0),
          fig(15, [mirrorQ(g15)], ['v', 'r', 'o', 'm'].map(t => box(tf(t, g15))), 3),
          fig(16, [mirrorQ(g16)], ['v', 'o', 'm', 'r'].map(t => box(tf(t, g16))), 2),
        ] },
      { part: 'Part – V',
        dir: '<b>Directions:</b> In Question Nos. <b>17</b> to <b>20</b>, a question figure is given and four answer figures marked (A), (B), (C) and (D) are given. Select the answer figure in which the question figure is hidden / embedded.',
        qs: [
          fig(17, [box(PL([[10, 44], [22, 44], [22, 26], [40, 26], [40, 44], [50, 44]]))], [
            P([[30, 4], [56, 30], [30, 56], [4, 30]]) + R(17, 17, 26, 26) + L(17, 17, 43, 43) + L(43, 17, 17, 43),
            [6, 14, 22, 30, 38, 46, 54].map(v => L(v, 1, v, 59) + L(1, v, 59, v)).join('').replace(/<line x1="22" y1="1"[^>]*>/, '') + L(1, 1, 59, 59),
            L(1, 44, 59, 44) + L(22, 1, 22, 59) + L(40, 1, 40, 59) + L(22, 26, 40, 26) + L(1, 1, 22, 26) + L(59, 1, 40, 26),
            L(1, 1, 59, 59) + L(59, 1, 1, 59) + L(30, 1, 30, 59) + L(1, 30, 59, 30) + R(15, 15, 30, 30),

/* ---------- text helpers ---------- */
const $ = s => document.querySelector(s);
const LET = ['A', 'B', 'C', 'D'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtU = s => esc(s).replace(/\[(\d+)\s*\/\s*(\d+)\]/g, (_, a, b) => f(a, b)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const fmtDir = s => fmtU(s).replace(/^(Directions(?:\s*\([^)]*\))?\s*:)/i, '<b>$1</b>');
const plain = h => String(h ?? '').replace(/<[^>]+>/g, '').trim();
const toText = h => {
  const d = document.createElement('div');
  d.innerHTML = String(h ?? '').replace(/<span class="frac"><span>(\d+)<\/span><span>(\d+)<\/span><\/span>/g, '[$1/$2]').replace(/<br\s*\/?>/g, '\n');
  return d.textContent.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
};

/* ---------- paper renderer (take + preview) ---------- */
function qHTML(q, n, trusted, preview) {
  const tx = s => trusted ? s : fmtU(s);
  const btn = (inner, i) => `<button type="button" class="opt${preview && q.a === i ? ' is-key' : ''}" data-q="${n}" data-o="${i}" aria-pressed="false"${preview ? ' tabindex="-1"' : ''} aria-label="Question ${n}, option ${LET[i]}">${inner}</button>`;
  if (q.kind === 'fig') {
    return `<article class="q" id="q${n}"><div class="qhead"><span class="qn">${n}.</span><div class="cap" style="margin:0">${q.label}</div></div>
      <div class="qfig">${q.qf.join('')}</div><div class="cap">${q.aLabel}</div>
      <div class="opts figopts">${q.opts.map((o, i) => btn(`${o}<span class="bub">${LET[i]}</span>`, i)).join('')}</div></article>`;
  }
  let fig = '';
  if (q.kind === 'img') {
    const src = imgSrc(q.img);
    fig = `<div class="qfig" style="margin-top:6px">${src ? `<img class="qimg" src="${esc(src)}" alt="Question ${n} figure">` : '<div class="imgph">Figure not added</div>'}</div>`;
    if (q.optMode === 'img') {
      return `<article class="q" id="q${n}"><div class="qhead"><span class="qn">${n}.</span><div class="qtext">${q.q ? tx(q.q) : '<b>Question Figure</b>'}</div></div>${fig}
        <div class="cap">Answer Figures</div>
        <div class="opts figopts">${[0, 1, 2, 3].map(i => { const s = imgSrc((q.optImgs || [])[i]); return btn(`${s ? `<img src="${esc(s)}" alt="Option ${LET[i]}">` : '<span class="imgph" style="width:52px;height:52px">—</span>'}<span class="bub">${LET[i]}</span>`, i); }).join('')}</div></article>`;
    }
  }
  const opts = (q.opts || ['', '', '', '']).slice(0, 4);
  const max = Math.max(...opts.map(o => plain(trusted ? o : esc(o)).length));
  const cols = max <= 11 ? 4 : max <= 30 ? 2 : 1;
  return `<article class="q" id="q${n}"><div class="qhead"><span class="qn">${n}.</span><div class="qtext">${tx(q.q || '') || '<span style="color:var(--muted)">Question text</span>'}</div></div>${fig}
    <div class="opts${cols === 1 ? ' long' : ''}" style="--n:${cols}">${opts.map((o, i) => btn(`<span class="bub">${LET[i]}</span><span class="ot">${tx(o) || '—'}</span>`, i)).join('')}</div></article>`;
}

      <div class="facts"><span><b>${total}</b> questions</span><span><b>${set.sections.length}</b> section${set.sections.length === 1 ? '' : 's'}</span><span><b>${esc(dur(set.minutes))}</b></span><span>Medium: <b>${esc(set.medium || 'English')}</b></span></div>
    </div></div>
    <ul class="instructions"><li>All questions are compulsory. Each question has only one correct answer.</li>
      <li>Darken one circle per question in the OMR Answer Sheet. Tap an option to mark it; tap again to clear.</li>
      <li>Use <b>Check answers</b> when you finish to see your section-wise score.</li></ul>`;
  const html = set.sections.map((sec, si) => {
    const from = n + 1;
    const body = (sec.items || []).map(it => {
      if (it.t === 'head') return `<div class="lead">${it.sub ? `<div class="subhead">${T ? it.sub : esc(it.sub)}</div>` : ''}${it.part ? `<div class="part">${T ? it.part : esc(it.part)}</div>` : ''}${it.dir ? `<p class="dir">${T ? it.dir : fmtDir(it.dir)}</p>` : ''}</div>`;
      if (it.t === 'passage') {
        const paras = String(it.text || '').split(/\n\s*\n/).filter(p => p.trim());
        return `<div class="passage">${it.title ? `<h3>${T ? it.title : esc(it.title)}</h3>` : ''}${paras.map(p => `<p>${T ? p : fmtU(p.trim())}</p>`).join('')}</div>`;
      }
      if (it.t === 'q') {
        const lib = it.kind === 'lib', q = lib ? BANK[it.ref] : it;
        n++;
        if (!q) return '';
        KEY[n] = q.a;
        return qHTML(q, n, T || lib, preview);
      }
      return '';
    }).join('');
    SECS.push({ name: sec.short || sec.title || sec.tag || `Section ${si + 1}`, from, to: n });
    const band = (sec.tag || sec.title || sec.dir) ? `<section class="band">${sec.tag ? `<div class="tag">${T ? sec.tag : esc(sec.tag)}</div>` : ''}${sec.title ? `<h2>${T ? sec.title : esc(sec.title)}</h2>` : ''}${sec.dir ? `<p class="dir">${T ? sec.dir : fmtDir(sec.dir)}</p>` : ''}</section>` : '';
    const sc = [14, 38, 62, 86].map(t => `<span class="scissor" style="top:${t}%">${scissor}</span>`).join('');
    const head = `<div class="runhead"><span>${esc(set.title || 'Model Paper')} · Practice Set – ${no}</span><span class="pg">${no}-${si + 1}</span></div>`;
    return `<article class="sheet">${sc}${head}${si === 0 ? mast : ''}${band}${body.trim() ? `<div class="cols">${body}</div>` : '<p class="emptysec">No questions in this section yet.</p>'}${si === set.sections.length - 1 ? '<div class="endmark">■ ■ ■</div>' : ''}</article>`;
  }).join('');
  return { html: html || `<article class="sheet">${mast}<p class="emptysec">Add a section to start.</p></article>`, KEY, SECS, total };
}

async function saveSet(set) {
  const body = clone(set); delete body.builtin; body.updatedAt = Date.now();
  if (S.mode === 'shared') { await S.db.collection('sets').doc(set.id).set(body); return; }
  const i = S.sets.findIndex(x => x.id === set.id);

}
async function deleteSet(id) {

async function initCaps() {

  const [db, user, assets, sample] = await Promise.all(['db', 'user', 'assets', 'sample'].map(n => cl.use(n).catch(() => null)));
  S.assets = assets; S.sample = sample;

  } else { S.sets = localLoad(); S.ready = true; onSetsChanged(); }

}

function paint() {
  if (cur.view !== 'take') return;
  const { ans, checked, P } = cur, KEY = P.KEY;
  view.querySelectorAll('.opt').forEach(b => {
    const q = +b.dataset.q, o = +b.dataset.o, sel = ans[q] === o;
    b.setAttribute('aria-pressed', sel);

    b.classList.toggle('is-wrong', checked && sel && KEY[q] !== o);
  });
  view.querySelectorAll('.ob').forEach(b => {
    const q = +b.dataset.q, o = +b.dataset.o, sel = ans[q] === o;
    b.classList.toggle('on', sel); b.classList.toggle('key', KEY[q] === o); b.classList.toggle('miss', sel && KEY[q] !== o);
  });
  const n = Object.keys(ans).filter(k => +k <= P.total).length;
  $('#cnt').textContent = n;
  $('#mtr').style.width = (P.total ? n / P.total * 100 : 0) + '%';
  $('#app').classList.toggle('checked', checked);
  document.querySelectorAll('[data-act="check"]').forEach(b => b.textContent = checked ? 'Keep practising' : 'Check answers');
  let total = 0;
  const rows = P.SECS.map((s, i) => {
    let ok = 0, done = 0; const size = s.to - s.from + 1;
    for (let q = s.from; q <= s.to; q++) { if (KEY[q] != null && ans[q] === KEY[q]) ok++; if (q in ans) done++; }

    return `<li>${esc(s.name)}<b>${ok} / ${size}</b><span class="meter"><i style="width:${size ? ok / size * 100 : 0}%"></i></span></li>`;
  });

        <button class="btn primary" type="button" data-act="add" data-k="q">+ Question</button>
        <button class="btn" type="button" data-act="add" data-k="img">+ Figure question</button>
        <button class="btn" type="button" data-act="add" data-k="passage">+ Passage</button>
        <button class="btn" type="button" data-act="add" data-k="head">+ Part heading</button>
        <button class="btn" type="button" data-act="bank">From Set 1 bank</button>
        ${S.sample ? '<button class="btn gold" type="button" data-act="gen">✦ Draft with Claude</button>' : ''}
      </div>
      ${S.sample ? `<div class="gen" id="gen"${cur.gen ? '' : ' hidden'}><h3>Draft questions with Claude</h3>
        <div class="row"><label class="fld" for="genMode"><span>What to write</span><select class="in" id="genMode"><option value="q">Questions</option><option value="p">Passage with questions</option></select></label>
          <label class="fld" for="genCount"><span>How many</span><input class="in" id="genCount" type="number" min="1" max="10" value="5"></label></div>
        <label class="fld" for="genTopic"><span>Topic</span><input class="in" id="genTopic" placeholder="${topicPh}"></label>
        <div class="addbar"><button class="btn gold" type="button" data-act="genrun" id="genRun">Write questions</button><button class="btn" type="button" data-act="genstop" id="genStop" hidden>Stop</button></div>
        <p class="genmsg" id="genMsg">Drafts are added to this section. Check every answer before students use the set.</p></div>` : ''}
    </section>` : ''}`;
}
function renderPreview() {
  clearTimeout(prevTimer); prevTimer = null;
  const el = $('#mkPrev'); if (!el) return;
  el.innerHTML = paperHTML(cur.draft, true).html;
}
const setStatus = (t, err) => { const el = $('#saveSt'); if (el) { el.textContent = t; el.classList.toggle('err', !!err); } };
function dirty(structural) {
  cur.dirty = true; setStatus('Saving…');
  if (structural) renderEditor();
  clearTimeout(prevTimer); prevTimer = setTimeout(renderPreview, 250);
  clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 1200);
}
async function doSave() {
  clearTimeout(saveTimer); saveTimer = null;
  if (cur.view !== 'maker' || !cur.dirty) return;
  const set = cur.draft; cur.dirty = false;
  try { await saveSet(set); if (cur.draft === set && !cur.dirty) setStatus('All changes saved'); }
  catch (e) {
    cur.dirty = true;
    const msg = e && e.code === 'not_granted' ? 'Not saved: your login is not allowed to change sets.'
      : e && e.code === 'invalid_argument' ? 'Not saved: this set is too large. Use smaller images.'
      : e && e.code === 'quota_exceeded' ? 'Not saved: storage is full.'
      : 'Not saved. Check your connection; changes are kept on this page.';
    setStatus(msg, true);
  }
}
function flushSave() { if (saveTimer && cur.view === 'maker') doSave(); }

/* image upload: downscale, then store as an asset (shared) or a data URL (this browser) */
async function storeImage(file) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise(r => c.toBlob(r, 'image/webp', .88));
  if (!blob || blob.type !== 'image/webp') blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
  if (S.assets) { const r = await S.assets.upload(blob, { type: blob.type }); return r.id; }
  return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
}

/* question bank picker */
function openBank() {
  const groups = {};
  Object.values(BANK).forEach(q => (groups[q.sec] = groups[q.sec] || []).push(q));
  ov.innerHTML = `<div class="ov" data-act="bankclose"><div class="ov-card" role="dialog" aria-modal="true" aria-labelledby="bankT">
    <div class="ov-h"><h2 id="bankT">Set 1 question bank</h2><button class="btn" type="button" data-act="bankclose">Close</button></div>
    <div class="ov-b">${Object.entries(groups).map(([g, qs]) => `<div class="bank-sec">${esc(g)}</div>${qs.map(q => `
      <label class="bank-row"><input type="checkbox" value="${q.n}"><span class="n">${q.n}</span>${q.kind === 'fig' ? q.qf[0] : '<span></span>'}
      <span class="tx">${q.kind === 'fig' ? `${esc(q.where)} · figure question` : esc(plain(q.q).slice(0, 120))}</span></label>`).join('')}`).join('')}</div>
    <div class="ov-f"><span class="subnote">Text questions are copied so you can edit them. Figure questions stay linked to Set 1.</span>
      <button class="btn primary" type="button" data-act="bankadd" id="bankAdd">Add selected</button></div></div></div>`;
  ov.querySelector('.ov-card').addEventListener('click', e => { if (!e.target.closest('[data-act]')) e.stopPropagation(); });
}

/* Claude drafts */
let genCtl = null;
async function generate() {
  const sec = cur.draft.sections[cur.sec]; if (!sec) return;
  const mode = $('#genMode').value, count = Math.min(10, Math.max(1, +$('#genCount').value || 5));
  const topic = $('#genTopic').value.trim() || 'a suitable topic for this section';
  const existing = (sec.items || []).filter(i => i.t === 'q' && i.q).map(i => '- ' + String(i.q).slice(0, 80)).join('\n');
  const prompt = `You write questions for the Jawahar Navodaya Vidyalaya Selection Test (JNVST), the entrance exam for Class VI in India (students aged 10–12).
Section: ${sec.title || sec.short || sec.tag}.
Topic: ${topic}.
${mode === 'p' ? `First write an original reading passage of 140–180 words in simple English, in two or three paragraphs, with a short title. Then write ${count} multiple-choice questions that can be answered from the passage (facts, a word meaning, a synonym or antonym, the main idea).` : `Write ${count} multiple-choice questions at JNVST difficulty.`}
Rules: each question has exactly 4 options and exactly one correct answer. Keep options short. Use plain text only. Write fractions as [a/b] (for example [3/5]) and money with ₹. Do not repeat these existing questions:
${existing || '(none)'}
Reply with only JSON in this shape:
{"passage": ${mode === 'p' ? '{"title": "string", "text": "paragraph one\\n\\nparagraph two"}' : 'null'}, "questions": [{"q": "question text", "options": ["A", "B", "C", "D"], "answer": 0}]}
"answer" is the index (0–3) of the correct option.`;
  const msg = $('#genMsg'), run = $('#genRun'), stop = $('#genStop');
  genCtl = new AbortController();
  run.disabled = true; stop.hidden = false; msg.textContent = 'Thinking…';
  try {
    const out = await S.sample.json(prompt, { signal: genCtl.signal, cache: false, onText: () => { msg.textContent = 'Writing questions…'; } });
    const qs = (Array.isArray(out && out.questions) ? out.questions : [])
      .filter(x => x && typeof x.q === 'string' && Array.isArray(x.options) && x.options.length === 4)
      .map(x => ({ t: 'q', kind: 'text', gen: true, q: x.q.trim(), opts: x.options.map(o => String(o).trim()), a: Number.isInteger(x.answer) && x.answer >= 0 && x.answer < 4 ? x.answer : null }));
    if (!qs.length) { msg.textContent = 'Claude did not return usable questions. Try a more specific topic.'; return; }
    const add = [];
    if (mode === 'p' && out.passage && typeof out.passage.text === 'string') add.push({ t: 'passage', gen: true, title: String(out.passage.title || ''), text: out.passage.text.trim() });
    sec.items = [...(sec.items || []), ...add, ...qs];
    cur.gen = true; dirty(true);
    const m = $('#genMsg'); if (m) m.textContent = `Added ${qs.length} question${qs.length === 1 ? '' : 's'}${add.length ? ' and a passage' : ''}. Check each answer before students use the set.`;
  } catch (e) {
    const t = { cancelled: 'Stopped.', not_granted: 'Claude is not allowed for this page. Allow it from the page’s Permissions menu to draft questions.', sampling_disabled: 'Claude is not available for this account.', rate_limited: 'Too many requests right now. Try again in a minute.', invalid_json: 'Claude’s reply could not be read. Try again.', refused: 'Claude declined this topic. Try a different one.' }[e && e.code];
    msg.textContent = t || 'Something went wrong while drafting. Try again.';
  } finally {
    const r = $('#genRun'), s2 = $('#genStop'); if (r) r.disabled = false; if (s2) s2.hidden = true; genCtl = null;
  }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const jump = e.target.closest('[data-jump]');
  if (jump) { const t = document.getElementById('q' + jump.dataset.jump); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (cur.view === 'take') {
    const b = e.target.closest('.opt, .ob');
    if (b && !cur.checked) {
      const q = +b.dataset.q, o = +b.dataset.o;
      if (cur.ans[q] === o) delete cur.ans[q]; else cur.ans[q] = o;
      cur.save(); paint(); return;
    }
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'new') { const s = blankSet(nextNo()); nextDraft = s; try { await saveSet(s); } catch (err) {} go('edit-' + s.id); }
  else if (act === 'dup') {
    const src = getSet(a.dataset.id); if (!src) return;
    const s = editableCopy(src); s.id = newId(); s.setNo = nextNo();
    if (!src.builtin) s.title = src.title;
    nextDraft = s; try { await saveSet(s); } catch (err) {} go('edit-' + s.id);
  }
  else if (act === 'del') {
    if (!a.classList.contains('armed')) { a.classList.add('armed'); a.textContent = 'Tap to delete'; setTimeout(() => { if (a.isConnected) { a.classList.remove('armed'); a.textContent = 'Delete'; } }, 3000); return; }
    a.disabled = true; try { await deleteSet(a.dataset.id); } catch (err) { a.textContent = 'Could not delete'; }
  }
  else if (act === 'timer') {
    const btn = $('#timerBtn');
    if (tick) { stopTimer(); btn.textContent = 'Resume'; return; }
    btn.textContent = 'Pause';
    tick = setInterval(() => {
      left = Math.max(0, left - 1); const c = $('#clock'); if (c) c.textContent = fmtT(left);
      if (!left) { stopTimer(); btn.textContent = 'Done'; btn.disabled = true; if (!cur.checked) toggleCheck(); }
    }, 1000);
  }
  else if (act === 'check') toggleCheck();
  else if (act === 'clear') {
    if (!a.classList.contains('armed')) { a.classList.add('armed'); a.textContent = 'Tap again to clear'; setTimeout(() => { if (a.isConnected) { a.classList.remove('armed'); a.textContent = 'Clear all'; } }, 2500); return; }
    cur.ans = {}; cur.checked = false; cur.save(); a.classList.remove('armed'); a.textContent = 'Clear all'; paint();
  }
  if (cur.view !== 'maker') return;
  const d = cur.draft, sec = d.sections[cur.sec];
  const card = a.closest('[data-i]'), ii = card ? +card.dataset.i : -1, items = sec ? sec.items : [];
  if (act === 'pane') {
    document.querySelectorAll('.mk-tabs .tab').forEach(t => t.setAttribute('aria-selected', t === a));
    $('#mkEdit').hidden = a.dataset.p !== 'edit'; $('#mkPrevWrap').hidden = a.dataset.p !== 'prev';
    if (a.dataset.p === 'prev') renderPreview();
  }
  else if (act === 'sec') { cur.sec = +a.dataset.s; renderEditor(); }
  else if (act === 'addsec') { d.sections.push({ tag: `Section ${d.sections.length + 1}`, title: 'New Section', short: '', dir: DIR_MCQ, items: [] }); cur.sec = d.sections.length - 1; dirty(true); }
  else if (act === 'secl' || act === 'secr') {
    const j = cur.sec + (act === 'secl' ? -1 : 1); if (j < 0 || j >= d.sections.length) return;
    [d.sections[cur.sec], d.sections[j]] = [d.sections[j], d.sections[cur.sec]]; cur.sec = j; dirty(true);
  }
  else if (act === 'delsec') {
    if (!a.classList.contains('armed')) { a.classList.add('armed'); a.textContent = `Delete with ${(sec.items || []).length} items?`; return; }
    d.sections.splice(cur.sec, 1); cur.sec = Math.max(0, cur.sec - 1); dirty(true);
  }
  else if (act === 'add') {
    const k = a.dataset.k;
    const it = k === 'q' ? { t: 'q', kind: 'text', q: '', opts: ['', '', '', ''], a: null }
      : k === 'img' ? { t: 'q', kind: 'img', q: '', img: '', optMode: 'img', optImgs: ['', '', '', ''], opts: ['', '', '', ''], a: null }
      : k === 'passage' ? { t: 'passage', title: '', text: '' } : { t: 'head', sub: '', part: '', dir: '' };
    items.push(it); dirty(true);
    const last = $('#mkEdit .items').lastElementChild; if (last) { last.scrollIntoView({ behavior: 'smooth', block: 'center' }); const f = last.querySelector('textarea, input.in'); if (f) f.focus({ preventScroll: true }); }
  }
  else if (act === 'up' || act === 'down') {
    const j = ii + (act === 'up' ? -1 : 1); if (j < 0 || j >= items.length) return;
    [items[ii], items[j]] = [items[j], items[ii]]; dirty(true);
  }
  else if (act === 'copy') { items.splice(ii + 1, 0, clone(items[ii])); dirty(true); }
  else if (act === 'rm') {
    if (!a.classList.contains('armed')) { a.classList.add('armed'); a.title = 'Tap again to remove'; setTimeout(() => a.isConnected && a.classList.remove('armed'), 2500); return; }
    items.splice(ii, 1); dirty(true);
  }
  else if (act === 'bank') openBank();
  else if (act === 'bankclose') { if (e.target === a || a.tagName === 'BUTTON') ov.innerHTML = ''; }
  else if (act === 'bankadd') {
    const refs = [...ov.querySelectorAll('input:checked')].map(i => +i.value);
    ov.innerHTML = '';
    if (refs.length) { refs.forEach(r => items.push(fromBank(r))); dirty(true); }
  }
  else if (act === 'gen') { cur.gen = !cur.gen; const g = $('#gen'); if (g) { g.hidden = !cur.gen; if (cur.gen) $('#genTopic').focus(); } }
  else if (act === 'genrun') generate();
  else if (act === 'genstop') genCtl && genCtl.abort();
});

document.addEventListener('input', e => {
  if (cur.view !== 'maker') return;
  const el = e.target, f = el.dataset && el.dataset.f; if (!f || el.type === 'file') return;
  const d = cur.draft;
  if (el.closest('[data-scope="meta"]')) { d[f] = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value; return dirty(false); }
  if (el.closest('[data-scope="sec"]')) {
    d.sections[cur.sec][f] = el.value;
    if (f === 'tag') { const t = document.querySelector(`.tab[data-s="${cur.sec}"]`); if (t && t.firstChild) t.firstChild.textContent = el.value || `Section ${cur.sec + 1}`; }
    return dirty(false);
  }
  const card = el.closest('[data-i]'); if (!card) return;
  const it = d.sections[cur.sec].items[+card.dataset.i];
  if (f === 'a') { it.a = +el.value; const w = card.querySelector('.chip.warn'); if (w && !it.gen) w.remove(); }
  else if (f === 'optMode') { it.optMode = el.checked ? 'img' : 'text'; return dirty(true); }
  else if (/^o\d$/.test(f)) { it.opts = it.opts || ['', '', '', '']; it.opts[+f[1]] = el.value; }
  else it[f] = el.value;
  dirty(false);
});

document.addEventListener('change', async e => {
  if (cur.view !== 'maker') return;
  const el = e.target, f = el.dataset && el.dataset.f;
  if (!f || el.type !== 'file' || !el.files || !el.files[0]) return;
  const card = el.closest('[data-i]'); if (!card) return;
  const it = cur.draft.sections[cur.sec].items[+card.dataset.i];
  const msg = card.querySelector('[data-msg]'); if (msg) msg.textContent = 'Uploading…';
  try {
    const ref = await storeImage(el.files[0]);
    if (f === 'img') it.img = ref;
    else { it.optImgs = it.optImgs || ['', '', '', '']; it.optImgs[+f.slice(4)] = ref; }
    dirty(true);
  } catch (err) {
    if (msg) msg.textContent = err && err.code === 'too_large' ? 'That image is too large.' : 'Could not add that image. Try a PNG or JPEG.';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ov.innerHTML) ov.innerHTML = ''; });
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', flushSave);

route();
initCaps();
})();
</script>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>JNV Practice Set 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&display=swap">
<style>
/* Layout: printed exam sheets on a desk, two-column question flow, OMR sheet docked beside them */
:root {
  --desk: #dde5e2;
  --paper: #fbfcfa;
  --ink: #142120;
  --muted: #5a6c68;
  --rule: #cbd6d2;
  --tint: #e9f0ee;
  --brand: #0e4f4b;
  --on-brand: #f3faf8;
  --gold: #c98a14;
  --piece: #b9d6d0;
  --good: #23784a;
  --bad: #b23c26;
  --shadow: 0 1px 2px rgba(14, 40, 38, .08), 0 12px 32px -12px rgba(14, 40, 38, .22);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1110; --paper: #151f1e; --ink: #e2ebe8; --muted: #93a6a1; --rule: #2a3936;
    --tint: #1d2b29; --brand: #5db5aa; --on-brand: #0b1110; --gold: #e6ac47; --piece: #2f5953;
    --good: #6cc58f; --bad: #ec7f66; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1110; --paper: #151f1e; --ink: #e2ebe8; --muted: #93a6a1; --rule: #2a3936;
  --tint: #1d2b29; --brand: #5db5aa; --on-brand: #0b1110; --gold: #e6ac47; --piece: #2f5953;
  --good: #6cc58f; --bad: #ec7f66; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--desk);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.bar-in {
  max-width: 1280px; margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
}
.brandmark { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; }
.brandmark .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
.brandmark small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.bar-stats { display: flex; align-items: center; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.stat { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.stat b { color: var(--ink); font-weight: 600; font-size: 14px; }
.meter { width: 90px; height: 5px; border-radius: 3px; background: var(--tint); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .25s ease; }
.btn {
  border: 1px solid var(--rule); background: var(--paper); border-radius: 999px;
  padding: 6px 14px; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .02em; cursor: pointer;
}
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }

/* ---------- page layout ---------- */
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
@media (min-width: 1140px) { .wrap { grid-template-columns: minmax(0, 1fr) 280px; align-items: start; } }
.sheets { display: grid; gap: 28px; min-width: 0; }

.sheet {
  position: relative; background: var(--paper); border-radius: 4px; box-shadow: var(--shadow);
  padding: clamp(18px, 3.4vw, 44px) clamp(16px, 3.4vw, 44px) 28px clamp(16px, 4.4vw, 60px);
  min-width: 0;
}
/* the perforated cut line printed on every sheet */
.sheet::before {
  content: ""; position: absolute; top: 18px; bottom: 18px; left: 20px;
  border-left: 1.5px dashed var(--rule);
}
.sheet .scissor { position: absolute; left: 12px; width: 17px; height: 17px; color: var(--muted); background: var(--paper); }
@media (max-width: 640px) { .sheet::before, .sheet .scissor { display: none; } }

.runhead {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  padding-bottom: 10px; margin-bottom: 22px; border-bottom: 2px solid var(--ink);
}
.runhead .pg { background: var(--ink); color: var(--paper); padding: 2px 10px; border-radius: 2px; letter-spacing: .04em; font-weight: 600; }

/* ---------- masthead ---------- */
.mast { display: grid; gap: 22px; align-items: center; grid-template-columns: auto 1fr; padding-bottom: 26px; border-bottom: 1px solid var(--rule); margin-bottom: 26px; }
.medal { width: 132px; height: 132px; }
.medal .ring { fill: none; stroke: var(--gold); stroke-width: 2; }
.medal .disc { fill: var(--brand); }
.medal .num { fill: var(--on-brand); font-family: var(--f-display); font-weight: 800; font-size: 64px; }
.medal .rib { fill: var(--gold); }
.medal .ribtxt { fill: #1a1405; font-family: var(--f-mono); font-weight: 600; font-size: 9.5px; letter-spacing: .14em; }
.mast .eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.mast h1 {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 4.6vw, 50px); line-height: 1; letter-spacing: -.025em;
  margin: 8px 0 6px; text-wrap: balance;
}
.mast h1 span { color: var(--brand); }
.mast .sub { font-family: var(--f-display); font-weight: 500; font-size: clamp(16px, 2vw, 20px); color: var(--muted); margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.facts span { font-family: var(--f-mono); font-size: 11.5px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 999px; color: var(--muted); }
.facts span b { color: var(--ink); font-weight: 600; }
@media (max-width: 560px) { .mast { grid-template-columns: 1fr; } .medal { width: 104px; height: 104px; } }

.instructions { font-size: 13.5px; color: var(--muted); display: grid; gap: 4px; margin: 0 0 8px; padding-left: 18px; }
.instructions li::marker { color: var(--gold); }

/* ---------- section bands, parts, directions ---------- */
.band { margin: 8px 0 18px; }
.band .tag {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--brand); color: var(--on-brand); font-family: var(--f-mono); font-weight: 600; font-size: 12px;
  letter-spacing: .22em; text-transform: uppercase; padding: 5px 12px; border-radius: 2px;
}
.band h2 {
  text-align: center; font-family: var(--f-display); font-weight: 800; font-size: clamp(17px, 2.3vw, 22px);
  letter-spacing: .02em; text-transform: uppercase; margin: 10px 0 10px; text-wrap: balance;
}
.band .dir { border: 1.5px solid var(--ink); padding: 10px 14px; font-style: italic; }
.dir { font-size: 13.5px; line-height: 1.55; margin: 0 0 14px; }
.dir b, .dir strong { font-style: normal; font-variant: small-caps; letter-spacing: .04em; font-weight: 700; }

.cols { column-gap: 44px; }
@media (min-width: 780px) { .cols { columns: 2; column-rule: 1px solid var(--rule); } }

.subhead {
  break-inside: avoid; break-after: avoid;
  display: inline-block; margin: 4px 0 14px; padding: 6px 16px 6px 12px;
  font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .02em; text-transform: uppercase;
  background: var(--tint); border-left: 4px solid var(--gold);
}
.part {
  break-inside: avoid; break-after: avoid;
  display: flex; align-items: center; gap: 12px; margin: 6px 0 10px;
  font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
}
.part::before, .part::after { content: ""; flex: 1; height: 7px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px); opacity: .55; }
.lead { break-inside: avoid; }

/* ---------- questions ---------- */
.q { break-inside: avoid; padding: 2px 0 16px; scroll-margin-top: 80px; }
.qhead { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: baseline; }
.qn { font-family: var(--f-display); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.qtext { font-size: 15px; }
.cap { font-family: var(--f-display); font-weight: 700; font-size: 13px; margin: 6px 0 6px 30px; }
.qfig { margin-left: 30px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

svg.fig { display: block; stroke: var(--ink); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; overflow: hidden; }
svg.fig .frame { stroke-width: 1.6; fill: var(--paper); }
svg.fig .k { fill: var(--ink); }
svg.fig .pc { fill: var(--piece); stroke-width: 1.8; }
svg.fig .hh { stroke-width: 2.6; }
svg.fig .thin { stroke-width: .9; }
svg.fig text { fill: var(--ink); stroke: none; font-family: var(--f-body); }
svg.fig .qm { font-size: 18px; font-weight: 600; }
svg.fig .lbl { font-size: 7px; font-weight: 700; }
.qfig svg.fig { width: 64px; height: 64px; }
.qfig svg.fig.big { width: 118px; height: 118px; }
.qfig svg.fig.mq { width: 88px; height: 67px; }

.opts { margin-left: 30px; display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 2px 10px; margin-top: 4px; }
@media (max-width: 420px) { .opts { --n: 2 !important; } .opts.long { --n: 1 !important; } }
.opt {
  display: flex; align-items: flex-start; gap: 8px; text-align: left; cursor: pointer;
  background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; min-width: 0;
  transition: background .15s, border-color .15s;
}
.opt:hover { background: var(--tint); }
.bub {
  flex: none; width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--muted);
  display: grid; place-items: center; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; color: var(--muted);
  margin-top: 1px; transition: background .15s, color .15s, border-color .15s;
}
.ot { min-width: 0; }
.opt[aria-pressed="true"] { background: var(--tint); border-color: color-mix(in srgb, var(--brand) 45%, transparent); }
.opt[aria-pressed="true"] .bub { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }

.figopts { grid-template-columns: repeat(4, minmax(0, 64px)); gap: 6px 12px; }
.figopts .opt { flex-direction: column; align-items: center; gap: 4px; padding: 4px; }
.figopts svg.fig { width: 52px; height: 52px; }

/* review state after checking */
.checked .opt { cursor: default; }
.checked .opt.is-right .bub { background: var(--good); border-color: var(--good); color: var(--paper); }
.checked .opt.is-right { border-color: color-mix(in srgb, var(--good) 55%, transparent); }
.checked .opt.is-wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.checked .opt.is-wrong .ot { text-decoration: line-through; text-decoration-color: var(--bad); }
.checked .opt.is-wrong { border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: transparent; }

/* fractions, tables, passages */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .82em; line-height: 1.05; margin: 0 1px; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
.passage { break-inside: avoid; margin-bottom: 16px; }
.passage h3 { font-family: var(--f-display); font-weight: 700; text-align: center; font-size: 16px; margin: 4px 0 8px; }
.passage p { margin: 0 0 8px; text-indent: 1.5em; font-size: 14.5px; }
.picto { width: 100%; border-collapse: collapse; margin: 8px 0 6px; font-size: 13.5px; }
.picto th { text-align: left; font-family: var(--f-display); font-weight: 700; padding: 5px 8px; border: 1px solid var(--ink); width: 34%; }
.picto td { padding: 5px 8px; border: 1px solid var(--ink); }
.smile { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-right: 3px; color: var(--gold); }
.endmark { text-align: right; font-family: var(--f-mono); color: var(--muted); letter-spacing: .3em; margin-top: 4px; }

/* ---------- OMR answer sheet ---------- */
.omr {
  background: var(--paper); border-radius: 4px; box-shadow: var(--shadow); padding: 18px 16px 20px;
  position: relative; min-width: 0;
}
@media (min-width: 1140px) { .omr { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); max-height: calc(100vh - 96px); overflow-y: auto; } }
.omr h2 { font-family: var(--f-display); font-weight: 800; font-size: 18px; margin: 0; letter-spacing: -.01em; }
.omr .hint { font-size: 12.5px; color: var(--muted); margin: 4px 0 14px; }
.omr-sec { margin-top: 14px; }
.omr-sec h3 {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  margin: 0 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--rule);
}
.omr-sec h3 b { color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.omr-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 12px; }
@media (min-width: 640px) and (max-width: 1139px) { .omr-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.orow { display: flex; align-items: center; gap: 3px; }
.orow a { width: 20px; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); text-decoration: none; font-variant-numeric: tabular-nums; }
.orow a:hover { color: var(--brand); }
.ob {
  width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--muted); background: none; padding: 0;
  font-family: var(--f-mono); font-size: 8.5px; color: var(--muted); cursor: pointer; display: grid; place-items: center;
}
.ob.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.checked .ob.key { box-shadow: 0 0 0 2px var(--good); }
.checked .ob.on.miss { background: var(--bad); border-color: var(--bad); }
.checked .ob.on.key { background: var(--good); border-color: var(--good); }

.score { display: none; margin-bottom: 4px; padding: 14px; border-radius: 4px; background: var(--tint); }
.checked .score { display: block; }
.score .big { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 16px; color: var(--muted); font-weight: 600; }
.score ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.score li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.score li b { color: var(--ink); font-variant-numeric: tabular-nums; }
.score li .meter { grid-column: 1 / -1; width: 100%; background: var(--paper); }
.score li .meter i { background: var(--good); }
.omr-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brandmark"><span class="dot">1</span><div>JNV Practice Set 1<small>Selection Test · Class VI</small></div></div>
    <div class="bar-stats">
      <div class="stat">Answered <b id="cnt">0</b>/80 <span class="meter"><i id="mtr"></i></span></div>
      <div class="stat">Time <b id="clock">2:00:00</b> <button class="btn" id="timerBtn" type="button">Start</button></div>
      <button class="btn primary" id="checkTop" type="button">Check answers</button>
    </div>
  </div>
</header>

<div class="wrap" id="app">
  <main class="sheets" id="sheets"></main>
  <aside class="omr" id="omr" aria-label="OMR answer sheet">
    <div class="score" id="score"></div>
    <h2>OMR Answer Sheet</h2>
    <p class="hint">Mark here or tap an option in the paper. Both stay in sync.</p>
    <div id="omrBody"></div>
    <div class="omr-actions">
      <button class="btn primary" id="checkSide" type="button">Check answers</button>
      <button class="btn" id="resetBtn" type="button">Clear all</button>
    </div>
  </aside>
</div>

<script>
(() => {
/* ---------- SVG primitives ---------- */
let uid = 0;
const L = (a, b, c, d, k = '') => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"${k ? ` class="${k}"` : ''}/>`;
const R = (x, y, w, h, k = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}"${k ? ` class="${k}"` : ''}/>`;
const C = (x, y, r, k = '') => `<circle cx="${x}" cy="${y}" r="${r}"${k ? ` class="${k}"` : ''}/>`;
const pts = p => p.map(q => q.map(n => +n.toFixed(2)).join(',')).join(' ');
const P = (p, k = '') => `<polygon points="${pts(p)}"${k ? ` class="${k}"` : ''}/>`;
const PL = p => `<polyline points="${pts(p)}"/>`;
const ngon = (cx, cy, r, n, start = -90) => Array.from({ length: n }, (_, i) => {
  const a = (start + i * 360 / n) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
});
const QM = (x, y) => `<text x="${x}" y="${y}" class="qm" text-anchor="middle" dominant-baseline="central">?</text>`;
const svg = (inner, w = 60, h = 60, k = '') => `<svg viewBox="0 0 ${w} ${h}" class="fig ${k}" aria-hidden="true">${inner}</svg>`;
const frame = (w = 60, h = 60) => R(1, 1, w - 2, h - 2, 'frame');
const box = inner => svg(frame() + inner);
const grid = inner => svg(frame(100, 100) + inner + L(50, 1, 50, 99) + L(1, 50, 99, 50), 100, 100, 'big');
const T = { m: 'translate(60 0) scale(-1 1)', v: 'translate(0 60) scale(1 -1)', r: 'rotate(180 30 30)', o: '' };
const tf = (t, g) => `<g transform="${T[t]}">${g}</g>`;
const mirrorQ = inner => {
  let hatch = '';
  for (let y = 10; y <= 56; y += 3.2) hatch += L(70, y, 74, y - 2.6, 'thin');
  return svg(`<g transform="translate(0 3)">${frame()}${inner}</g>` + L(70, 8, 70, 58) + hatch +
    `<text x="70" y="5.5" class="lbl" text-anchor="middle">X</text><text x="70" y="66" class="lbl" text-anchor="middle">Y</text>`, 84, 67, 'mq');
};

/* Part I */
const p1 = (o, y, s) => [.25, .5, .75].map(f => L(o + s * f, y, o + s * f, y + s)).join('');
const p2 = (o, y, s) => L(o + s * .3, y, o + s * .3, y + s) + L(o + s * .7, y, o + s * .7, y + s) + L(o + s * .3, y + s * .5, o + s * .7, y + s * .5);
const xq = (o, y, s, pos) => {
  const m = { t: [.5, .2], r: [.8, .5], b: [.5, .8], l: [.2, .5] }[pos];
  return L(o, y, o + s, y + s) + L(o + s, y, o, y + s) + C(o + s * m[0], y + s * m[1], s * .075);
};
const dots = (o, y, s, list) => list.map(([c, r]) => C(o + s * (.22 + .28 * c), y + s * (.22 + .28 * r), s * .085, 'k')).join('');
const dq = (o, y, s, t) => {
  const d = { a: [0, [.3, .3]], b: [1, [.7, .3]], c: [1, [.3, .7]], d: [0, [.7, .7]], e: [0, [.7, .3]] }[t];
  const diag = d[0] ? L(o + s, y, o, y + s) : L(o, y, o + s, y + s);
  return diag + C(o + s * d[1][0], y + s * d[1][1], s * .17) + L(o + s * d[1][0] - s * .17, y + s * d[1][1], o + s * d[1][0] + s * .17, y + s * d[1][1]);
};
/* Part II */

      dir: '<b>Directions:</b> There are four passages in this section. Each passage is followed by five questions. Read each passage carefully and answer the questions that follow. For each question, four probable answers as (A), (B), (C) and (D) are given. Only one out of these is correct.' },
    blocks: [
      { part: 'Passage – 1', passage: { paras: [
          'At the edge of the village playground stands an old banyan tree. Its broad branches spread outward like open arms. Although no one now remembers who planted it, the villagers regard it as an important part of their shared life. Children sit beneath its shade after playing, and elders gather there in the evenings to discuss village matters.',
          'During the summer season, travellers rest under the tree to escape the heat. Long aerial roots hang from its branches and gradually reach the ground, forming additional trunks. Over the years, the tree has expanded in width. It has silently witnessed festivals, meetings, and moments of happiness. For the villagers, it represents not merely a tree but their collective memory.'] },
        qs: [
          tx(61, 'The banyan tree stands at the edge of the village ______.', ['market', 'playground', 'temple', 'school'], 1),
          tx(62, 'Why do travellers rest under the tree during summer?', ['To meet villagers', 'To water the roots', 'To sell goods', 'To escape the heat'], 3),
          tx(63, 'The aerial roots gradually reach the ground and form additional ______.', ['leaves', 'fruits', 'trunks', 'flowers'], 2),
          tx(64, 'Why do villagers consider the tree important?', ['It represents their collective memory.', 'It provides wood for construction.', 'It is the tallest tree in the village.', 'It grows very quickly each year.'], 0),
          tx(65, 'The word “collective” most nearly means:', ['Personal', 'Shared', 'Secret', 'Temporary'], 1),
        ] },
      { part: 'Passage – 2', passage: { paras: [
          'Ritu enjoyed observing small details that others often ignored, such as the shape of leaves and the patterns formed by raindrops on glass. When her school announced a science fair, she decided to construct a simple water filter using layers of sand, charcoal, and small stones.',
          'On the day of the exhibition, her model was neither the largest nor the most decorative. However, when she poured muddy water into the filter and clear water emerged, many students gathered around her table. The judges listened attentively as she explained the process. Although she did not win the first prize, she felt satisfied because her model functioned successfully.'] },
        qs: [
          tx(66, 'Ritu decided to construct a simple water ______.', ['pump', 'tank', 'filter', 'pipe'], 2),
          tx(67, 'Why did many students gather around her table?', ['Her model was brightly decorated.', 'The judges called them there.', 'She had already won a prize.', 'Clear water emerged from her model.'], 3),
          tx(68, 'She used sand, charcoal, and small ______ to construct her model.', ['plants', 'papers', 'stones', 'wires'], 2),
          tx(69, 'Why did Ritu feel satisfied at the end?', ['Her model functioned successfully.', 'Her classmates praised her loudly.', 'She received the first prize.', 'She completed her project quickly.'], 0),
          tx(70, 'The word “attentively” most nearly means:', ['Carelessly', 'With focus', 'Angrily', 'Secretly'], 1),
        ] },
      { part: 'Passage – 3', passage: { paras: [
          'Before the development of railway networks, traders travelled across deserts in organised caravans. Camels carried spices, cloth, and precious stones between distant towns. Such journeys required careful planning, patience, and discipline. Travellers moved mainly at dawn and dusk in order to avoid the extreme heat of midday.',
          'Water supplies were carefully preserved, and directions were determined by observing the stars at night. A caravan functioned as a moving community in which each member depended upon the others for safety and survival. The desert, though silent in appearance, tested the courage and endurance of all who crossed it.'] },
        qs: [
          tx(71, 'Travellers moved mainly at dawn and ______.', ['midnight', 'evening', 'dusk', 'afternoon'], 2),
          tx(72, 'Why was a caravan described as a “moving community”?', ['Its members depended on one another.', 'It entertained travellers during the journey.', 'It stayed permanently in villages.', 'It built settlements along the way.'], 0),
          tx(73, 'The desert tested the courage and ______ of the travellers.', ['wealth', 'endurance', 'speed', 'popularity'], 1),
          tx(74, 'Read statements I and II and choose the correct option:<br><span style="display:block;margin:4px 0 0 12px">I. Water supplies were carefully preserved during the journey.<br>II. Travellers moved at midday to enjoy the sunlight.</span>', ['Both I and II are true.', 'Both I and II are false.', 'I is false, but II is true.', 'I is true, but II is false.'], 3),
          tx(75, 'Which of the following is <em>not</em> a synonym of “fearless”?', ['Brave', 'Courageous', 'Timid', 'Valiant'], 2),
        ] },
      { part: 'Passage – 4', passage: { paras: [
          'Glaciers are vast masses of ice found in high mountain regions. They are formed when layers of snow accumulate and compress over many years. Although they appear motionless, glaciers move gradually and shape valleys and rocky surfaces over long periods of time.',
          'Scientists have observed that many glaciers are shrinking due to rising global temperatures. When ice melts faster than it forms, rivers that depend on glacial water are affected. This imbalance influences agriculture, urban settlements, and drinking water supplies in distant regions. Therefore, changes in glaciers have significant consequences for human life.'] },
        qs: [
          tx(76, 'Why are glaciers important?', ['They increase rainfall.', 'They shape valleys and influence water supply.', 'They create mountains.', 'They prevent wind movement.'], 1),
          tx(77, 'What is the primary cause of shrinking glaciers?', ['Rising global temperatures', 'Heavy snowfall', 'Strong desert winds', 'Frequent earthquakes'], 0),
          tx(78, 'Layers of snow accumulate and ______ over many years.', ['melt', 'freeze', 'compress', 'disappear'], 2),
          tx(79, 'The melting of glaciers affects:', ['only wildlife in mountains.', 'railway transportation.', 'rivers and water supply systems.', 'desert trade routes.'], 2),
          tx(80, 'Which of the following words is an antonym of “motionless”?', ['Still', 'Silent', 'Frozen', 'Active'], 3),
        ] },
    ] },
];

const SECTIONS = [
  { name: 'Mental Ability', from: 1, to: 20 },
  { name: 'Environmental Studies', from: 21, to: 40 },
  { name: 'Arithmetic', from: 41, to: 60 },
  { name: 'Language', from: 61, to: 80 },
];

/* ---------- render ---------- */
const KEY = {};
const LET = ['A', 'B', 'C', 'D'];
const plain = h => h.replace(/<[^>]+>/g, '').trim();
const scissor = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>';

const renderQ = q => {
  KEY[q.n] = q.a;
  const btn = (inner, i) => `<button type="button" class="opt" data-q="${q.n}" data-o="${i}" aria-pressed="false" aria-label="Question ${q.n}, option ${LET[i]}">${inner}</button>`;
  if (q.kind === 'fig') {
    return `<article class="q" id="q${q.n}">
      <div class="qhead"><span class="qn">${q.n}.</span><div class="cap" style="margin:0">${q.label}</div></div>
      <div class="qfig">${q.qf.join('')}</div>
      <div class="cap">${q.aLabel}</div>
      <div class="opts figopts">${q.opts.map((o, i) => btn(`${o}<span class="bub">${LET[i]}</span>`, i)).join('')}</div>
    </article>`;
  }
  const max = Math.max(...q.opts.map(o => plain(o).length));
  const n = max <= 11 ? 4 : max <= 30 ? 2 : 1;
  return `<article class="q" id="q${q.n}">
    <div class="qhead"><span class="qn">${q.n}.</span><div class="qtext">${q.q}</div></div>
    <div class="opts${n === 1 ? ' long' : ''}" style="--n:${n}">${q.opts.map((o, i) => btn(`<span class="bub">${LET[i]}</span><span class="ot">${o}</span>`, i)).join('')}</div>
  </article>`;
};

const mast = `<div class="mast">
  <svg class="medal" viewBox="0 0 132 132" aria-hidden="true">
    <circle class="ring" cx="66" cy="60" r="56"/><circle class="disc" cx="66" cy="60" r="49"/>
    <text class="num" x="66" y="62" text-anchor="middle" dominant-baseline="central">1</text>
    <path class="rib" d="M10 96 L122 96 L114 108 L122 120 L10 120 L18 108 Z"/>
    <text class="ribtxt" x="66" y="109" text-anchor="middle" dominant-baseline="central">PRACTICE SET</text>
  </svg>
  <div>
    <div class="eyebrow">Model Question Paper · Entrance Examination</div>
    <h1>Jawahar Navodaya <span>Vidyalaya</span></h1>
    <p class="sub">Selection Test for admission to Class VI</p>
    <div class="facts"><span><b>80</b> questions</span><span><b>3</b> sections</span><span><b>2</b> hours</span><span>Medium: <b>English</b></span></div>
  </div>
</div>
<ul class="instructions">
  <li>All questions are compulsory. Each question has only one correct answer.</li>
  <li>Darken one circle per question in the OMR Answer Sheet. Tap an option to mark it; tap again to clear.</li>
  <li>Use <b>Check answers</b> when you finish to see your section-wise score.</li>
</ul>`;

const pageTags = ['1-1', '1-2', '1-3', '1-4'];
document.getElementById('sheets').innerHTML = PAPER.map((s, si) => {
  const head = `<div class="runhead"><span>Jawahar Navodaya Vidyalaya · Practice Set – 1</span><span class="pg">${pageTags[si]}</span></div>`;
  const band = s.band ? `<section class="band"><div class="tag">${s.band.tag}</div><h2>${s.band.title}</h2><p class="dir">${s.band.dir}</p></section>` : '';
  const body = s.blocks.map(b => {
    const lead = (b.sub ? `<div class="subhead">${b.sub}</div>` : '') + (b.part ? `<div class="part">${b.part}</div>` : '');
    const dir = b.dir ? `<p class="dir">${b.dir}</p>` : '';
    const pas = b.passage ? `<div class="passage">${b.passage.title ? `<h3>${b.passage.title}</h3>` : ''}${b.passage.paras.map(p => `<p>${p}</p>`).join('')}</div>` : '';
    return `<div class="lead">${lead}${dir}</div>${pas}${b.qs.map(renderQ).join('')}`;
  }).join('');
  const sc = [14, 38, 62, 86].map(t => `<span class="scissor" style="top:${t}%">${scissor}</span>`).join('');
  return `<article class="sheet">${sc}${head}${si === 0 ? mast : ''}${band}<div class="cols">${body}</div>${si === PAPER.length - 1 ? '<div class="endmark">■ ■ ■</div>' : ''}</article>`;
}).join('');

document.getElementById('omrBody').innerHTML = SECTIONS.map((s, i) => {
  let rows = '';
  for (let n = s.from; n <= s.to; n++) rows += `<div class="orow"><a href="#q${n}">${n}</a>${LET.map((l, o) => `<button type="button" class="ob" data-q="${n}" data-o="${o}" aria-label="Question ${n} option ${l}">${l}</button>`).join('')}</div>`;
  return `<div class="omr-sec"><h3>${s.name} <b id="sc${i}">0/20</b></h3><div class="omr-grid">${rows}</div></div>`;
}).join('');

/* ---------- state ---------- */
const STORE = 'jnv-ps1-v1';
let ans = {}, checked = false;
try { const s = JSON.parse(localStorage.getItem(STORE) || '{}'); ans = s.ans || {}; checked = !!s.checked; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ ans, checked })); } catch (e) {} };
const app = document.getElementById('app');

const paint = () => {
  document.querySelectorAll('.opt').forEach(b => {
    const q = +b.dataset.q, o = +b.dataset.o, sel = ans[q] === o;
    b.setAttribute('aria-pressed', sel);
    b.classList.toggle('is-right', checked && KEY[q] === o);
    b.classList.toggle('is-wrong', checked && sel && KEY[q] !== o);
  });
  document.querySelectorAll('.ob').forEach(b => {
    const q = +b.dataset.q, o = +b.dataset.o, sel = ans[q] === o;
    b.classList.toggle('on', sel);
    b.classList.toggle('key', KEY[q] === o);
    b.classList.toggle('miss', sel && KEY[q] !== o);
  });
  const n = Object.keys(ans).length;
  document.getElementById('cnt').textContent = n;
  document.getElementById('mtr').style.width = (n / 80 * 100) + '%';
  app.classList.toggle('checked', checked);
  ['checkTop', 'checkSide'].forEach(id => document.getElementById(id).textContent = checked ? 'Keep practising' : 'Check answers');
  let total = 0;
  const rows = SECTIONS.map((s, i) => {
    let ok = 0;
    for (let q = s.from; q <= s.to; q++) if (ans[q] === KEY[q]) ok++;
    total += ok;
    document.getElementById('sc' + i).textContent = checked ? `${ok}/20` : `${Array.from({ length: 20 }, (_, k) => s.from + k).filter(q => q in ans).length}/20`;
    return `<li>${s.name}<b>${ok} / 20</b><span class="meter"><i style="width:${ok * 5}%"></i></span></li>`;
  });
  document.getElementById('score').innerHTML = `<div class="big">${total}<small> / 80</small></div><ul>${rows.join('')}</ul>`;
};

document.addEventListener('click', e => {
  const b = e.target.closest('.opt, .ob');
  if (!b || checked) return;
  const q = +b.dataset.q, o = +b.dataset.o;
  if (ans[q] === o) delete ans[q]; else ans[q] = o;
  save(); paint();
});
const toggleCheck = () => {
  checked = !checked; save(); paint();
  if (checked) document.getElementById('omr').scrollIntoView({ behavior: 'smooth', block: 'start' });
};
document.getElementById('checkTop').onclick = toggleCheck;
document.getElementById('checkSide').onclick = toggleCheck;
const resetBtn = document.getElementById('resetBtn');
let armed = false;
resetBtn.onclick = () => {
  if (!armed) { armed = true; resetBtn.textContent = 'Tap again to clear'; setTimeout(() => { armed = false; resetBtn.textContent = 'Clear all'; }, 2500); return; }
  armed = false; resetBtn.textContent = 'Clear all';
  ans = {}; checked = false; save(); paint();
};

/* ---------- 2-hour timer ---------- */
let left = 7200, tick = null;
const clockEl = document.getElementById('clock'), tBtn = document.getElementById('timerBtn');
const fmt = s => `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
tBtn.onclick = () => {
  if (tick) { clearInterval(tick); tick = null; tBtn.textContent = 'Resume'; return; }
  tBtn.textContent = 'Pause';
  tick = setInterval(() => {
    left = Math.max(0, left - 1); clockEl.textContent = fmt(left);
    if (!left) { clearInterval(tick); tick = null; tBtn.textContent = 'Done'; tBtn.disabled = true; if (!checked) toggleCheck(); }
  }, 1000);
};

paint();
})();
</script>
</body></html>

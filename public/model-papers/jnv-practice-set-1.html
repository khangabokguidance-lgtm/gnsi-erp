/* Layout: printed exam sheets on a desk; library of sets, paper + docked OMR sheet, and a two-pane set maker with live preview */
:root {
  --desk: #dde5e2;
  --paper: #fbfcfa;
  --ink: #142120;
  --muted: #5a6c68;
  --rule: #cbd6d2;
  --tint: #e9f0ee;
  --brand: #0e4f4b;
  --on-brand: #f3faf8;
  --gold: #c98a14;
  --piece: #b9d6d0;
  --good: #23784a;
  --bad: #b23c26;
  --scrim: rgba(12, 26, 24, .45);
  --shadow: 0 1px 2px rgba(14, 40, 38, .08), 0 12px 32px -12px rgba(14, 40, 38, .22);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Literata", Georgia, "Times New Roman", "Noto Sans Meetei Mayek", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0b1110; --paper: #151f1e; --ink: #e2ebe8; --muted: #93a6a1; --rule: #2a3936;
    --tint: #1d2b29; --brand: #5db5aa; --on-brand: #0b1110; --gold: #e6ac47; --piece: #2f5953;
    --good: #6cc58f; --bad: #ec7f66; --scrim: rgba(0, 0, 0, .62); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0b1110; --paper: #151f1e; --ink: #e2ebe8; --muted: #93a6a1; --rule: #2a3936;
  --tint: #1d2b29; --brand: #5db5aa; --on-brand: #0b1110; --gold: #e6ac47; --piece: #2f5953;
  --good: #6cc58f; --bad: #ec7f66; --scrim: rgba(0, 0, 0, .62); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -14px rgba(0,0,0,.7);

}

.bm { font-family: "BMEI04", sans-serif !important; font-weight: 400; font-style: normal; text-transform: none !important; letter-spacing: normal !important; font-variant: normal !important; font-size: 1.12em; }
* { box-sizing: border-box; }
body {
  background: var(--desk); color: var(--ink); font-family: var(--f-body);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
a { color: var(--brand); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.bar-in {
  max-width: 1360px; margin: 0 auto; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; min-height: 58px;
}
.brandmark { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; text-decoration: none; color: var(--ink); min-width: 0; }
.brandmark .dot { flex: none; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.brandmark small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.bar-stats { display: flex; align-items: center; gap: 10px 16px; margin-left: auto; flex-wrap: wrap; }
.stat { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.stat b { color: var(--ink); font-weight: 600; font-size: 14px; }
.meter { width: 90px; height: 5px; border-radius: 3px; background: var(--tint); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .25s ease; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--rule); background: var(--paper); border-radius: 999px;
  padding: 6px 14px; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .02em; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--brand); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1a1405; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.chipnote { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 3px 9px; border: 1px dashed var(--rule); border-radius: 999px; }

/* ---------- page layout ---------- */
.wrap {
  max-width: 1360px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
@media (min-width: 1140px) { .wrap.take { grid-template-columns: minmax(0, 1fr) 280px; align-items: start; } }
.sheets { display: grid; gap: 28px; min-width: 0; container-type: inline-size; }

.sheet {
  position: relative; background: var(--paper); border-radius: 4px; box-shadow: var(--shadow);
  padding: clamp(18px, 3.4vw, 44px) clamp(16px, 3.4vw, 44px) 28px clamp(16px, 4.4vw, 60px); min-width: 0;
}
.sheet::before { content: ""; position: absolute; top: 18px; bottom: 18px; left: 20px; border-left: 1.5px dashed var(--rule); }
.sheet .scissor { position: absolute; left: 12px; width: 17px; height: 17px; color: var(--muted); background: var(--paper); }
@container (max-width: 600px) { .sheet::before, .sheet .scissor { display: none; } }

.runhead {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  padding-bottom: 10px; margin-bottom: 22px; border-bottom: 2px solid var(--ink);
}
.runhead .pg { background: var(--ink); color: var(--paper); padding: 2px 10px; border-radius: 2px; letter-spacing: .04em; font-weight: 600; white-space: nowrap; }

/* ---------- masthead ---------- */
.mast { display: grid; gap: 22px; align-items: center; grid-template-columns: auto 1fr; padding-bottom: 26px; border-bottom: 1px solid var(--rule); margin-bottom: 26px; }
.medal { width: 132px; height: 132px; }
.medal .ring { fill: none; stroke: var(--gold); stroke-width: 2; }
.medal .disc { fill: var(--brand); }
.medal .num { fill: var(--on-brand); font-family: var(--f-display); font-weight: 800; }
.medal .rib { fill: var(--gold); }
.medal .ribtxt { fill: #1a1405; font-family: var(--f-mono); font-weight: 600; font-size: 9.5px; letter-spacing: .14em; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.mast h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 4.6vw, 50px); line-height: 1; letter-spacing: -.025em; margin: 8px 0 6px; text-wrap: balance; overflow-wrap: anywhere; }
.mast h1 span { color: var(--brand); }
.mast .sub { font-family: var(--f-display); font-weight: 500; font-size: clamp(16px, 2vw, 20px); color: var(--muted); margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.facts span { font-family: var(--f-mono); font-size: 11.5px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 999px; color: var(--muted); }
.facts span b { color: var(--ink); font-weight: 600; }
@container (max-width: 560px) { .mast { grid-template-columns: 1fr; } .medal { width: 104px; height: 104px; } }

.instructions { font-size: 13.5px; color: var(--muted); display: grid; gap: 4px; margin: 0 0 8px; padding-left: 18px; }
.instructions li::marker { color: var(--gold); }

/* ---------- section bands, parts, directions ---------- */
.band { margin: 8px 0 18px; }
.band .tag { display: flex; align-items: center; justify-content: center; background: var(--brand); color: var(--on-brand); font-family: var(--f-mono); font-weight: 600; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; padding: 5px 12px; border-radius: 2px; }
.band h2 { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: clamp(17px, 2.3vw, 22px); letter-spacing: .02em; text-transform: uppercase; margin: 10px 0; text-wrap: balance; }
.band .dir { border: 1.5px solid var(--ink); padding: 10px 14px; font-style: italic; }
.dir { font-size: 13.5px; line-height: 1.55; margin: 0 0 14px; }
.dir b, .dir strong { font-style: normal; font-variant: small-caps; letter-spacing: .04em; font-weight: 700; }

.cols { column-gap: 44px; }
@container (min-width: 720px) { .cols { columns: 2; column-rule: 1px solid var(--rule); } }

.subhead { break-inside: avoid; break-after: avoid; display: inline-block; margin: 4px 0 14px; padding: 6px 16px 6px 12px; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .02em; text-transform: uppercase; background: var(--tint); border-left: 4px solid var(--gold); }
.part { break-inside: avoid; break-after: avoid; display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
.part::before, .part::after { content: ""; flex: 1; height: 7px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px); opacity: .55; }
.lead { break-inside: avoid; }
.emptysec { color: var(--muted); font-style: italic; text-align: center; padding: 24px 0; margin: 0; }

/* ---------- questions ---------- */
.q { break-inside: avoid; padding: 2px 0 16px; scroll-margin-top: 80px; }
.qhead { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: baseline; }
.qn { font-family: var(--f-display); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.qtext { font-size: 15px; overflow-wrap: anywhere; }
.cap { font-family: var(--f-display); font-weight: 700; font-size: 13px; margin: 6px 0 6px 30px; }
.qfig { margin-left: 30px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.qimg { display: block; max-width: 100%; max-height: 220px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; }
img.imgbad { min-width: 52px; min-height: 52px; border: 1.5px dashed var(--rule); background: transparent; }
.imgph { width: 120px; height: 80px; display: grid; place-items: center; border: 1.5px dashed var(--rule); color: var(--muted); font-family: var(--f-mono); font-size: 10.5px; border-radius: 3px; text-align: center; }

svg.fig { display: block; stroke: var(--ink); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; overflow: hidden; }
svg.fig .frame { stroke-width: 1.6; fill: var(--paper); }
svg.fig .k { fill: var(--ink); }
svg.fig .pc { fill: var(--piece); stroke-width: 1.8; }
svg.fig .hh { stroke-width: 2.6; }
svg.fig .thin { stroke-width: .9; }
svg.fig text { fill: var(--ink); stroke: none; font-family: var(--f-body); }
svg.fig .qm { font-size: 18px; font-weight: 600; }
svg.fig .lbl { font-size: 7px; font-weight: 700; }
.qfig svg.fig { width: 64px; height: 64px; }
.qfig svg.fig.big { width: 118px; height: 118px; }
.qfig svg.fig.mq { width: 88px; height: 67px; }

.opts { margin-left: 30px; display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 2px 10px; margin-top: 4px; }
@container (max-width: 420px) { .opts { --n: 2 !important; } .opts.long { --n: 1 !important; } }
.opt { display: flex; align-items: flex-start; gap: 8px; text-align: left; cursor: pointer; background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; min-width: 0; transition: background .15s, border-color .15s; }
.opt:hover { background: var(--tint); }
.bub { flex: none; width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; color: var(--muted); margin-top: 1px; transition: background .15s, color .15s, border-color .15s; }
.ot { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-pressed="true"] { background: var(--tint); border-color: color-mix(in srgb, var(--brand) 45%, transparent); }
.opt[aria-pressed="true"] .bub { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.figopts { grid-template-columns: repeat(4, minmax(0, 64px)); gap: 6px 12px; }
.figopts .opt { flex-direction: column; align-items: center; gap: 4px; padding: 4px; }
.figopts svg.fig { width: 52px; height: 52px; }

  return t + hand(h, 10.5, 'hh') + hand(m, 16) + C(30, 30, 1.6, 'k');

/* ---------- built-in Set 1 in the shared set format ---------- */
const BANK = {};
const BUILTIN = {
  id: 'set1', builtin: true, setNo: 1, title: 'Jawahar Navodaya Vidyalaya',
  subtitle: 'Selection Test for admission to Class VI', minutes: 120, medium: 'English', sections: [],
};
const SHORTS = ['MAT & EVS', 'Arithmetic', 'Language'];
PAPER.forEach(sheet => {
  if (sheet.band) BUILTIN.sections.push({ tag: sheet.band.tag, title: sheet.band.title, short: SHORTS[BUILTIN.sections.length], dir: sheet.band.dir, items: [] });
  const sec = BUILTIN.sections[BUILTIN.sections.length - 1];
  let where = sec.short;
  sheet.blocks.forEach(b => {
    if (b.sub || b.part || b.dir) sec.items.push({ t: 'head', sub: b.sub || '', part: b.part || '', dir: b.dir || '' });
    if (b.part || b.sub) where = (b.sub && !b.part ? b.sub : b.part) || where;
    if (b.passage) sec.items.push({ t: 'passage', title: b.passage.title || '', text: b.passage.paras.join('\n\n') });

/* ---------- text helpers ---------- */
const $ = s => document.querySelector(s);
const LET = ['A', 'B', 'C', 'D'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* text read from a scan often repeats what the paper itself prints: "(A) Bus" for option A, or the
   "Question Figure / Answer Figures" captions as the question. Drop those when showing and importing. */
const OPT_LABEL = /^\s*[([]?\s*([A-Da-d])\s*[)\].:]\s*/;
const cleanOpt = (o, i) => { const t = String(o ?? ''), m = t.match(OPT_LABEL); return m && m[1].toUpperCase() === LET[i] ? t.slice(m[0].length) : t; };
const CAPTION_LINE = /^\s*(question|answer)\s+figures?\s*:?\s*$/i;
const cleanQ = q => String(q ?? '').split('\n').filter(l => !CAPTION_LINE.test(l)).join('\n').trim();
const fmtU = s => esc(s).replace(/\[(\d+)\s*\/\s*(\d+)\]/g, (_, a, b) => f(a, b)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const fmtDir = s => fmtU(s).replace(/^(Directions(?:\s*\([^)]*\))?\s*:)/i, '<b>$1</b>');
const plain = h => String(h ?? '').replace(/<[^>]+>/g, '').trim();
const toText = h => {
  const d = document.createElement('div');
  d.innerHTML = String(h ?? '').replace(/<span class="frac"><span>(\d+)<\/span><span>(\d+)<\/span><\/span>/g, '[$1/$2]').replace(/<br\s*\/?>/g, '\n');
  return d.textContent.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
};
const imgSrc = r => /^[0-9a-f]{32}$/.test(r || '') ? '/_blob/' + r
  : /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(r || '') ? r
  : /^https:\/\/[^\s"'<>]+$/.test(r || '') ? r : '';
/* a picture whose public link does not load (the portal's storage bucket is not public) is read
   again through the portal's signed-in session; if that fails too, show an empty frame, not alt text */
const portalImage = url => CL && typeof CL.imageUrl === 'function' ? Promise.resolve(CL.imageUrl(url)).catch(() => null) : Promise.resolve(null);
document.addEventListener('error', async e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  if (img.dataset.retried) { img.alt = ''; img.classList.add('imgbad'); return; }
  img.dataset.retried = '1';
  const src = img.getAttribute('src') || '', alt = /^https:/.test(src) ? await portalImage(src) : null;
  if (alt) { img.removeAttribute('crossorigin'); img.src = alt; } else { img.alt = ''; img.classList.add('imgbad'); }
}, true);
const newId = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const dur = m => { m = +m || 120; return m % 60 === 0 ? `${m / 60} hour${m === 60 ? '' : 's'}` : `${m} minutes`; };
const countQ = set => set.sections.reduce((n, s) => n + (s.items || []).filter(i => i.t === 'q').length, 0);
const scissor = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>';
const medal = (no, cls = 'medal') => {
  const s = esc(String(no ?? 1)).slice(0, 3), fs = s.length > 2 ? 38 : s.length > 1 ? 50 : 64;
  return `<svg class="${cls}" viewBox="0 0 132 132" aria-hidden="true"><circle class="ring" cx="66" cy="60" r="56"/><circle class="disc" cx="66" cy="60" r="49"/>
    <text class="num" x="66" y="62" text-anchor="middle" dominant-baseline="central" style="font-size:${fs}px">${s}</text>
    <path class="rib" d="M10 96 L122 96 L114 108 L122 120 L10 120 L18 108 Z"/>
    <text class="ribtxt" x="66" y="109" text-anchor="middle" dominant-baseline="central">PRACTICE SET</text></svg>`;
};

const DIR_MCQ = 'Directions: For every question, four probable answers as (A), (B), (C) and (D) are given. Only one out of these is correct. Choose the correct answer and darken the circle in the OMR Answer Sheet against the number corresponding to the question.';
const blankSet = no => ({

/* an editable copy of a built-in question: figures and the pictograph stay linked to Set 1 */
const fromBank = n => {
  const q = BANK[n];
  if (q.kind === 'fig' || /<table/.test(q.q)) return { t: 'q', kind: 'lib', ref: n };
  return { t: 'q', kind: 'text', q: toText(q.q), opts: q.opts.map(toText), a: q.a };
};
const editableCopy = set => {
  const out = clone({ ...set, sections: [] });
  delete out.builtin;
  out.sections = set.sections.map(s => ({
    tag: toText(s.tag), title: toText(s.title), short: s.short || '', dir: set.builtin ? toText(s.dir) : s.dir,
    items: (s.items || []).map(it => !set.builtin ? clone(it)
      : it.t === 'q' ? fromBank(it.n)
      : it.t === 'head' ? { t: 'head', sub: toText(it.sub), part: toText(it.part), dir: toText(it.dir) }
      : { t: 'passage', title: toText(it.title), text: it.text }),

/* ---------- paper renderer (take + preview) ---------- */
function qHTML(q, n, trusted, preview) {
  const tx = s => trusted ? s : fmtU(s);
  const btn = (inner, i) => `<button type="button" class="opt${preview && q.a === i ? ' is-key' : ''}" data-q="${n}" data-o="${i}" aria-pressed="false"${preview ? ' tabindex="-1"' : ''} aria-label="Question ${n}, option ${LET[i]}">${inner}</button>`;
  if (q.kind === 'fig') {
    return `<article class="q" id="q${n}"><div class="qhead"><span class="qn">${n}.</span><div class="cap" style="margin:0">${q.label}</div></div>
      <div class="qfig">${q.qf.join('')}</div><div class="cap">${q.aLabel}</div>
      <div class="opts figopts">${q.opts.map((o, i) => btn(`${o}<span class="bub">${LET[i]}</span>`, i)).join('')}</div></article>`;
  }
  let fig = '';
  if (q.kind === 'img') {
    const src = imgSrc(q.img);
    fig = `<div class="qfig" style="margin-top:6px">${src ? `<img class="qimg" src="${esc(src)}" alt="Question ${n} figure">` : '<div class="imgph">Figure not added</div>'}</div>`;
    if (q.optMode === 'img') {
      const qt = trusted ? q.q : cleanQ(q.q);
      return `<article class="q" id="q${n}"><div class="qhead"><span class="qn">${n}.</span><div class="qtext">${qt ? tx(qt) : '<b>Question Figure</b>'}</div></div>${fig}
        <div class="cap">${esc(q.afig || 'Answer Figures')}</div>
        <div class="opts figopts">${[0, 1, 2, 3].map(i => { const s = imgSrc((q.optImgs || [])[i]); return btn(`${s ? `<img src="${esc(s)}" alt="Option ${LET[i]}">` : '<span class="imgph" style="width:52px;height:52px">—</span>'}<span class="bub">${LET[i]}</span>`, i); }).join('')}</div></article>`;
    }
  }
  const opts = (q.opts || ['', '', '', '']).slice(0, 4).map((o, i) => trusted ? o : cleanOpt(o, i));
  const max = Math.max(...opts.map(o => plain(trusted ? o : esc(o)).length));
  const cols = max <= 11 ? 4 : max <= 30 ? 2 : 1;
  return `<article class="q" id="q${n}"><div class="qhead"><span class="qn">${n}.</span><div class="qtext">${tx(trusted ? q.q || '' : cleanQ(q.q)) || '<span style="color:var(--muted)">Question text</span>'}</div></div>${fig}
    <div class="opts${cols === 1 ? ' long' : ''}" style="--n:${cols}">${opts.map((o, i) => btn(`<span class="bub">${LET[i]}</span><span class="ot">${tx(o) || '—'}</span>`, i)).join('')}</div></article>`;
}

function paperHTML(set, preview) {
  const T = !!set.builtin, KEY = {}, SECS = [], total = countQ(set);
  let n = 0;
  const no = esc(String(set.setNo ?? 1));
  const words = esc(set.title || 'Model Question Paper').split(' ');
  const title = words.length > 1 ? `${words.slice(0, -1).join(' ')} <span>${words[words.length - 1]}</span>` : `<span>${words[0]}</span>`;
  const mast = `<div class="mast">${medal(set.setNo)}<div>
      <div class="eyebrow">Model Question Paper · Entrance Examination</div>
      <h1>${title}</h1><p class="sub">${esc(set.subtitle || '')}</p>
      <div class="facts"><span><b>${total}</b> questions</span><span><b>${set.sections.length}</b> section${set.sections.length === 1 ? '' : 's'}</span><span><b>${esc(dur(set.minutes))}</b></span><span>Medium: <b>${esc(set.medium || 'English')}</b></span></div>
    </div></div>
    <ul class="instructions">${set.labels && set.labels.ins ? set.labels.ins.map(t => `<li>${esc(t)}</li>`).join('') : `<li>All questions are compulsory. Each question has only one correct answer.</li>
      <li>Darken one circle per question in the OMR Answer Sheet.</li>`}<li>Tap an option to mark it; tap again to clear.</li>
      <li>Use <b>Check answers</b> when you finish to see your section-wise score.</li></ul>`;
  const html = set.sections.map((sec, si) => {
    const from = n + 1;
    const body = (sec.items || []).map(it => {
      if (it.t === 'head') return `<div class="lead">${it.sub ? `<div class="subhead">${T ? it.sub : esc(it.sub)}</div>` : ''}${it.part ? `<div class="part">${T ? it.part : esc(it.part)}</div>` : ''}${it.dir ? `<p class="dir">${T ? it.dir : fmtDir(it.dir)}</p>` : ''}</div>`;
      if (it.t === 'passage') {
        const paras = String(it.text || '').split(/\n\s*\n/).filter(p => p.trim());
        return `<div class="passage">${it.title ? `<h3>${T ? it.title : esc(it.title)}</h3>` : ''}${paras.map(p => `<p>${T ? p : fmtU(p.trim())}</p>`).join('')}</div>`;
      }
      if (it.t === 'q') {
        const lib = it.kind === 'lib', q = lib ? libQ(set, it.ref) : it;
        n++;
        if (!q) return '';
        KEY[n] = q.a;
        return qHTML(q, n, T || lib, preview);
      }
      return '';
    }).join('');
    SECS.push({ name: sec.short || sec.title || sec.tag || `Section ${si + 1}`, from, to: n });
    const band = (sec.tag || sec.title || sec.dir) ? `<section class="band">${sec.tag ? `<div class="tag">${T ? sec.tag : esc(sec.tag)}</div>` : ''}${sec.title ? `<h2>${T ? sec.title : esc(sec.title)}</h2>` : ''}${sec.dir ? `<p class="dir">${T ? sec.dir : fmtDir(sec.dir)}</p>` : ''}</section>` : '';
    const sc = [14, 38, 62, 86].map(t => `<span class="scissor" style="top:${t}%">${scissor}</span>`).join('');
    const head = `<div class="runhead"><span>${esc(set.title || 'Model Paper')} · Practice Set – ${no}</span><span class="pg">${no}-${si + 1}</span></div>`;
    return `<article class="sheet">${sc}${head}${si === 0 ? mast : ''}${band}${body.trim() ? `<div class="cols">${body}</div>` : '<p class="emptysec">No questions in this section yet.</p>'}${si === set.sections.length - 1 ? '<div class="endmark">■ ■ ■</div>' : ''}</article>`;
  }).join('');
  return { html: mayekify(html || `<article class="sheet">${mast}<p class="emptysec">Add a section to start.</p></article>`), KEY, SECS, total };
}

async function saveSet(set) {
  const body = clone(set); delete body.builtin; body.updatedAt = Date.now();
  if (S.mode === 'shared') { await S.db.collection('sets').doc(set.id).set(body); return; }
  const i = S.sets.findIndex(x => x.id === set.id);
  if (i < 0) S.sets.push(body); else S.sets[i] = body;
  if (!localSave()) throw { code: 'quota_exceeded', message: 'Browser storage is full. Remove some images.' };
}
async function deleteSet(id) {
  if (S.mode === 'shared') { await S.db.collection('sets').doc(id).delete(); return; }

}

const stopTimer = () => { if (tick) clearInterval(tick); tick = null; };
const fmtT = s => `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function showTake(id) {
  const set = getSet(id);
  if (!set) return S.ready ? waitView('This set was deleted or the link is wrong.') : waitView('Loading set…');
  const P = paperHTML(set, false);
  const store = 'jnv-ans-' + id;
  let st = { ans: {}, checked: false };
  try { const s = JSON.parse(localStorage.getItem(id === 'set1' ? 'jnv-ps1-v1' : store) || '{}'); st = { ans: s.ans || {}, checked: !!s.checked }; } catch (e) {}
  cur = { view: 'take', id, set, P, ...st, save() { try { localStorage.setItem(id === 'set1' ? 'jnv-ps1-v1' : store, JSON.stringify({ ans: this.ans, checked: this.checked })); } catch (e) {} } };
  left = (+set.minutes || 120) * 60;
  bar.innerHTML = brand(esc(String(set.setNo ?? 1)), `Practice Set ${esc(String(set.setNo ?? 1))}`, mayekify(esc(set.title || ''))) +
    `<div class="bar-stats">
      <div class="stat">Answered <b id="cnt">0</b>/${P.total} <span class="meter"><i id="mtr"></i></span></div>
      <div class="stat">Time <b id="clock">${fmtT(left)}</b> <button class="btn" id="timerBtn" type="button" data-act="timer">Start</button></div>
      <button class="btn primary" type="button" data-act="check">Check answers</button>
      <button class="btn" type="button" data-act="export" data-id="${id}">Download</button>
      <a class="btn" href="#library">All sets</a></div>`;
  const omr = P.SECS.map((s, i) => {
    let rows = '';
    for (let n = s.from; n <= s.to; n++) rows += `<div class="orow"><button type="button" class="oq" data-jump="${n}">${n}</button>${LET.map((l, o) => `<button type="button" class="ob" data-q="${n}" data-o="${o}" aria-label="Question ${n} option ${l}">${l}</button>`).join('')}</div>`;
    return `<div class="omr-sec"><h3>${mayekify(esc(s.name))} <b id="sc${i}">0/${s.to - s.from + 1}</b></h3><div class="omr-grid">${rows}</div></div>`;
  }).join('');
  view.innerHTML = `<div class="wrap take" id="app"><main class="sheets">${P.html}</main>
    <aside class="omr" id="omr" aria-label="OMR answer sheet"><div class="score" id="score"></div>
      <h2>OMR Answer Sheet</h2><p class="hint">Mark here or tap an option in the paper. Both stay in sync.</p>${omr || '<p class="hint">This set has no questions yet.</p>'}
      <div class="omr-actions"><button class="btn primary" type="button" data-act="check">Check answers</button><button class="btn" type="button" data-act="clear">Clear all</button></div></aside></div>`;
  paint();
}
function paint() {
  if (cur.view !== 'take') return;
  const { ans, checked, P } = cur, KEY = P.KEY;
  view.querySelectorAll('.opt').forEach(b => {
    const q = +b.dataset.q, o = +b.dataset.o, sel = ans[q] === o;
    b.setAttribute('aria-pressed', sel);
    b.classList.toggle('is-right', checked && KEY[q] === o);
    b.classList.toggle('is-wrong', checked && sel && KEY[q] !== o);
  });
  view.querySelectorAll('.ob').forEach(b => {
    const q = +b.dataset.q, o = +b.dataset.o, sel = ans[q] === o;
    b.classList.toggle('on', sel); b.classList.toggle('key', KEY[q] === o); b.classList.toggle('miss', sel && KEY[q] !== o);
  });
  const n = Object.keys(ans).filter(k => +k <= P.total).length;
  $('#cnt').textContent = n;
  $('#mtr').style.width = (P.total ? n / P.total * 100 : 0) + '%';
  $('#app').classList.toggle('checked', checked);
  document.querySelectorAll('[data-act="check"]').forEach(b => b.textContent = checked ? 'Keep practising' : 'Check answers');
  let total = 0;
  const rows = P.SECS.map((s, i) => {
    let ok = 0, done = 0; const size = s.to - s.from + 1;
    for (let q = s.from; q <= s.to; q++) { if (KEY[q] != null && ans[q] === KEY[q]) ok++; if (q in ans) done++; }
    total += ok;
    const el = $('#sc' + i); if (el) el.textContent = `${checked ? ok : done}/${size}`;
    return `<li>${mayekify(esc(s.name))}<b>${ok} / ${size}</b><span class="meter"><i style="width:${size ? ok / size * 100 : 0}%"></i></span></li>`;
  });
  $('#score').innerHTML = `<div class="big">${total}<small> / ${P.total}</small></div><ul>${rows.join('')}</ul>`;
}
function toggleCheck() {
  cur.checked = !cur.checked; cur.save(); paint();
  if (cur.checked) $('#omr').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderPreview() {
  clearTimeout(prevTimer); prevTimer = null;
  const el = $('#mkPrev'); if (!el) return;
  el.innerHTML = paperHTML(cur.draft, true).html;
}
const setStatus = (t, err) => { const el = $('#saveSt'); if (el) { el.textContent = t; el.classList.toggle('err', !!err); } };
function dirty(structural) {
  cur.dirty = true; setStatus('Saving…');
  if (structural) renderEditor();
  clearTimeout(prevTimer); prevTimer = setTimeout(renderPreview, 250);
  clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 1200);
}
async function doSave() {
  clearTimeout(saveTimer); saveTimer = null;
  if (cur.view !== 'maker' || !cur.dirty) return;
  const set = cur.draft; cur.dirty = false;
  try { await saveSet(set); if (cur.draft === set && !cur.dirty) setStatus('All changes saved'); }
  catch (e) {
    cur.dirty = true;
    const msg = e && e.code === 'not_granted' ? 'Not saved: your login is not allowed to change sets.'
      : e && e.code === 'invalid_argument' ? 'Not saved: this set is too large. Use smaller images.'
      : e && e.code === 'quota_exceeded' ? 'Not saved: storage is full.'
      : 'Not saved. Check your connection; changes are kept on this page.';
    setStatus(msg, true);
  }
}
function flushSave() { if (saveTimer && cur.view === 'maker') doSave(); }

/* image upload: downscale, then store as an asset (shared) or a data URL (this browser) */
async function storeImage(file, maxSide = 900) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise(r => c.toBlob(r, 'image/webp', .88));
  if (!blob || blob.type !== 'image/webp') blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
  if (S.assets) { const r = await S.assets.upload(blob, { type: blob.type }); return r.id; }
  return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
}

/* Claude drafts */
let genCtl = null;
async function generate() {
  const sec = cur.draft.sections[cur.sec]; if (!sec) return;
  const mode = $('#genMode').value, count = Math.min(10, Math.max(1, +$('#genCount').value || 5));
  const topic = $('#genTopic').value.trim() || 'a suitable topic for this section';
  const existing = (sec.items || []).filter(i => i.t === 'q' && i.q).map(i => '- ' + String(i.q).slice(0, 80)).join('\n');
  const prompt = `You write questions for the Jawahar Navodaya Vidyalaya Selection Test (JNVST), the entrance exam for Class VI in India (students aged 10–12).
Section: ${sec.title || sec.short || sec.tag}.
Topic: ${topic}.
${mode === 'p' ? `First write an original reading passage of 140–180 words in simple English, in two or three paragraphs, with a short title. Then write ${count} multiple-choice questions that can be answered from the passage (facts, a word meaning, a synonym or antonym, the main idea).` : `Write ${count} multiple-choice questions at JNVST difficulty.`}
Rules: each question has exactly 4 options and exactly one correct answer. Keep options short. Use plain text only. Write fractions as [a/b] (for example [3/5]) and money with ₹. Do not repeat these existing questions:
${existing || '(none)'}
Reply with only JSON in this shape:
{"passage": ${mode === 'p' ? '{"title": "string", "text": "paragraph one\\n\\nparagraph two"}' : 'null'}, "questions": [{"q": "question text", "options": ["A", "B", "C", "D"], "answer": 0}]}
"answer" is the index (0–3) of the correct option.`;
  const msg = $('#genMsg'), run = $('#genRun'), stop = $('#genStop');
  genCtl = new AbortController();
  run.disabled = true; stop.hidden = false; msg.textContent = 'Thinking…';
  try {
    const out = await S.sample.json(prompt, { signal: genCtl.signal, cache: false, onText: () => { msg.textContent = 'Writing questions…'; } });
    const qs = (Array.isArray(out && out.questions) ? out.questions : [])
      .filter(x => x && typeof x.q === 'string' && Array.isArray(x.options) && x.options.length === 4)
      .map(x => ({ t: 'q', kind: 'text', gen: true, q: x.q.trim(), opts: x.options.map(o => String(o).trim()), a: Number.isInteger(x.answer) && x.answer >= 0 && x.answer < 4 ? x.answer : null }));
    if (!qs.length) { msg.textContent = 'Claude did not return usable questions. Try a more specific topic.'; return; }
    const add = [];
    if (mode === 'p' && out.passage && typeof out.passage.text === 'string') add.push({ t: 'passage', gen: true, title: String(out.passage.title || ''), text: out.passage.text.trim() });
    sec.items = [...(sec.items || []), ...add, ...qs];
    cur.gen = true; dirty(true);
    const m = $('#genMsg'); if (m) m.textContent = `Added ${qs.length} question${qs.length === 1 ? '' : 's'}${add.length ? ' and a passage' : ''}. Check each answer before students use the set.`;
  } catch (e) {
    const t = { cancelled: 'Stopped.', not_granted: 'Claude is not allowed for this page. Allow it from the page’s Permissions menu to draft questions.', sampling_disabled: 'Claude is not available for this account.', rate_limited: 'Too many requests right now. Try again in a minute.', invalid_json: 'Claude’s reply could not be read. Try again.', refused: 'Claude declined this topic. Try a different one.' }[e && e.code];
    msg.textContent = t || 'Something went wrong while drafting. Try again.';
  } finally {
    const r = $('#genRun'), s2 = $('#genStop'); if (r) r.disabled = false; if (s2) s2.hidden = true; genCtl = null;
  }
}

/* ---------- Meetei Mayek: Unicode text drawn with the BMEI04 font ---------- */
// Sets keep Meetei Mayek as Unicode (U+ABC0–U+ABFF), so it stays searchable and
// unambiguous next to digits, ₹ and English words. Wherever a paper is drawn
// (screen, PDF, Word), each run of Mayek letters is turned into the BMEI04
// keystrokes the school types in Word and shown in the BMEI04 font; everything
// else stays in the normal type. Same table as the portal's meetei_mayek.js.
const BMEI_KEYS = {
  'ꯀ': 'k', 'ꯁ': 's', 'ꯂ': 'l', 'ꯃ': 'm', 'ꯄ': 'p', 'ꯅ': 'n', 'ꯆ': 'c', 'ꯇ': 't', 'ꯋ': 'w', 'ꯌ': 'y', 'ꯍ': 'h',
  'ꯐ': 'f', 'ꯒ': 'g', 'ꯔ': 'r', 'ꯕ': 'b', 'ꯖ': 'j', 'ꯗ': 'd', 'ꯉ': 'z', 'ꯈ': 'H', 'ꯚ': 'v', 'ꯊ': 'Y',
  'ꯛ': 'K', 'ꯜ': 'L', 'ꯝ': 'M', 'ꯞ': 'P', 'ꯟ': 'N', 'ꯠ': 'T', 'ꯡ': 'Z', 'ꯏ': 'I', 'ꯢ': 'I',
  'ꯥ': 'a', 'ꯦ': 'e', 'ꯩ': 'E', 'ꯤ': 'i', 'ꯣ': 'o', 'ꯧ': 'O', 'ꯨ': 'u', 'ꯪ': 'x', 'ꯑ': 'A', 'ꯎ': 'U',
  '꯫': '|', '꯬': '.', '꯭': '_', 'ꯓ': 'J', 'ꯘ': 'G', 'ꯙ': 'D',
};
const isClusterC = c => typeof c === 'string' && c >= 'ꯀ' && c <= 'ꯚ' && c !== 'ꯎ' && c !== 'ꯏ' && c !== 'ꯑ';
// ꯐ꯭ꯌ → "fy_": BMEI04 types APUN IYEK after the cluster it joins
function meeteiToBmei(text) {
  const out = [], ch = [...String(text || '')];
  for (let i = 0; i < ch.length; i++) {
    const c = ch[i];
    if (isClusterC(c) && ch[i + 1] === '꯭' && isClusterC(ch[i + 2])) { out.push(BMEI_KEYS[c], BMEI_KEYS[ch[i + 2]], '_'); i += 2; continue; }
    out.push(BMEI_KEYS[c] !== undefined ? BMEI_KEYS[c] : c);
  }
  return out.join('');
}
const MM_RUN = /[ꯀ-꯭]+(?:[  ]+[ꯀ-꯭]+)*/g;
const hasMayek = s => /[ꯀ-꯭]/.test(String(s || ''));
// in a finished HTML string, draw each Mayek run in BMEI04 (Mayek letters only ever come from content, never markup)
const mayekify = html => hasMayek(html) ? html.replace(MM_RUN, run => `<span class="bm">${esc(meeteiToBmei(run))}</span>`) : html;

/* the built-in figure questions keep their figures; their captions follow the set's language */
function libQ(set, ref) {
  const q = BANK[ref];
  if (!q || !set.labels || q.kind !== 'fig') return q;
  const L = set.labels;
  return { ...q, label: q.label === 'Question Figures' ? (L.qfigs || q.label) : (L.qfig || q.label), aLabel: L.afig || q.aLabel };
}

/* ---------- translate a set into Manipuri (Meetei Mayek) ---------- */
const MM_INSTRUCTIONS = ['All questions are compulsory. Each question has only one correct answer.', 'Darken one circle per question in the OMR Answer Sheet.'];
async function translatorKind() {
  if (CL && typeof CL.translateMM === 'function') return 'portal';
  if (S.sample) return 'claude';
  return null;
}
const MM_PROMPT = list => `Translate each English string below into Manipuri (Meiteilon), written in Unicode Meetei Mayek script (U+ABC0–U+ABFF). They are parts of a model question paper for the Jawahar Navodaya Vidyalaya Selection Test (Class VI entrance, students aged 10–12): questions, answer choices, directions and reading passages.

Rules:
- Use simple, natural Manipuri a Class VI student in Manipur would read in an exam.
- Keep these exactly as written: numbers, ₹, units (m, cm, km, °), fractions written as [a/b], × ÷ = + −, blanks (_____), Roman numerals, and labels such as (A), I. and II.
- Proper names (people, places, books) are written in Meetei Mayek letters by sound.
- Return one translation per string, in the same order, with nothing added or left out.

Reply with only a JSON array of exactly ${list.length} strings.

${JSON.stringify(list)}`;
const errText = e => String((e && (e.message || e.code)) || e || 'unknown error').slice(0, 200);
const isRateLimit = e => (e && e.code === 'rate_limited') || /429|too many|rate/i.test(errText(e));
const wait = (ms, signal) => new Promise(r => { const t = setTimeout(r, ms); if (signal) signal.addEventListener('abort', () => { clearTimeout(t); r(); }, { once: true }); });
// Translates in small batches, paced, each retried once. A batch that still fails keeps its
// English text and the rest carry on, so one rate limit or dropped connection never throws
// away the whole set. Returns { out, failed, reason }.
async function translateList(kind, texts, onProgress, signal) {
  const size = kind === 'portal' ? 20 : 30;
  const out = [];
  let failed = 0, reason = '';
  for (let i = 0; i < texts.length; i += size) {
    if (signal && signal.aborted) throw { code: 'cancelled' };
    const chunk = texts.slice(i, i + size);
    let got = null;
    for (let attempt = 0; attempt < 2 && !got; attempt++) {
      try {
        got = kind === 'portal' ? await CL.translateMM(chunk) : await S.sample.json(MM_PROMPT(chunk), { signal, cache: false });
        if (!Array.isArray(got) || got.length !== chunk.length) { reason = 'the translator returned a different number of lines'; got = null; }
      } catch (e) {
        if (e && ['cancelled', 'not_granted', 'sampling_disabled'].includes(e.code)) throw e;
        if (signal && signal.aborted) throw { code: 'cancelled' };
        reason = errText(e);
        if (attempt === 0) {
          const ms = isRateLimit(e) ? 30000 : 4000;
          onProgress(i, texts.length, `Waiting ${ms / 1000} s before trying again (${reason})…`);
          await wait(ms, signal);
        }
      }
    }
    chunk.forEach((t, k) => {
      const v = got && typeof got[k] === 'string' && got[k].trim() ? got[k].trim() : null;
      if (!v) failed++;
      out.push(v || t);
    });
    onProgress(Math.min(texts.length, i + size), texts.length);
    if (kind === 'portal' && i + size < texts.length) await wait(1500, signal);   // stays under the portal's per-minute AI limit
  }
  return { out, failed, reason };
}

/* every translatable string in a set, as setters, so the result can be written back in place */
function translatableFields(set) {
  const f = [];
  const add = (get, put) => { const v = get(); if (typeof v === 'string' && /[A-Za-z]{2}/.test(v) && !hasMayek(v)) f.push({ text: v, put }); };
  add(() => set.title, v => { set.title = v; });
  add(() => set.subtitle, v => { set.subtitle = v; });
  // English captions to start from; a Mayek set already has its own (and they are skipped below)
  set.labels = set.labels || { qfig: 'Question Figure', qfigs: 'Question Figures', afig: 'Answer Figures', ins: MM_INSTRUCTIONS.slice() };
  add(() => set.labels.qfig, v => { set.labels.qfig = v; });
  add(() => set.labels.qfigs, v => { set.labels.qfigs = v; });
  add(() => set.labels.afig, v => { set.labels.afig = v; });
  set.labels.ins.forEach((t, i) => add(() => t, v => { set.labels.ins[i] = v; }));
  set.sections.forEach(sec => {
    ['tag', 'title', 'short', 'dir'].forEach(k => add(() => sec[k], v => { sec[k] = v; }));
    (sec.items || []).forEach(it => {
      if (it.t === 'head') ['sub', 'part', 'dir'].forEach(k => add(() => it[k], v => { it[k] = v; }));
      else if (it.t === 'passage') {
        add(() => it.title, v => { it.title = v; });
        const paras = String(it.text || '').split(/\n\s*\n/);
        paras.forEach((p, i) => add(() => p.trim(), v => { paras[i] = v; it.text = paras.join('\n\n'); }));
      } else if (it.t === 'q' && it.kind !== 'lib') {
        if (it.kind === 'img' && it.optMode === 'img') { it.afig = it.afig || 'Answer Figures'; add(() => it.afig, v => { it.afig = v; }); }
        add(() => it.q, v => { it.q = v; });
        (it.opts || []).forEach((o, i) => add(() => o, v => { it.opts[i] = v; }));
      }
    });
  });
  return f;
}

async function runTranslate() {
  if (!mmJob || mmJob.busy) return;
  const job = mmJob, src = exportSet(job.id); if (!src) return;
  const msg = t => { const m = $('#mmMsg'); if (m && mmJob === job) m.textContent = t; };
  const kind = await translatorKind(); if (!kind) return;
  job.busy = true; job.ctl = new AbortController();
  $('#mmRun').disabled = true; $('#mmStop').hidden = false;
  try {
    // A Mayek set is finished in place: only its parts still in English are translated.
    const inPlace = !!src.mayek && !src.builtin;
    const set = editableCopy(src);
    if (inPlace) { set.id = src.id; set.setNo = src.setNo; }
    else { set.id = newId(); set.setNo = nextNo(); }
    set.medium = 'Manipuri (Meetei Mayek)'; set.mayek = true;
    const fields = translatableFields(set);
    const unique = [...new Set(fields.map(x => x.text))];
    if (!unique.length) { msg('Everything in this set is already in Meetei Mayek.'); return; }
    msg(`Translating ${unique.length} pieces of text…`);
    const r = await translateList(kind, unique, (n, total, note) => msg(note || `Translated ${n} of ${total}…`), job.ctl.signal);
    if (mmJob !== job) return;
    if (r.failed === unique.length) throw { code: 'all_failed', message: r.reason };
    const map = new Map(unique.map((t, i) => [t, r.out[i]]));
    fields.forEach(x => x.put(map.get(x.text) ?? x.text));
    const left = unique.filter(t => !hasMayek(map.get(t))).length;
    msg('Saving…');
    if (inPlace && cur.view === 'maker' && cur.id === set.id) {
      cur.draft = set; mmJob = null; ov.innerHTML = ''; dirty(true);
    } else {
      nextDraft = set;
      try { await saveSet(set); } catch (e) { /* the maker shows the save state */ }
      mmJob = null; ov.innerHTML = '';
      go('edit-' + set.id);
    }
    if (left) setTimeout(() => setStatus(`${left} piece${left === 1 ? '' : 's'} of text are still in English${r.reason ? ` (${r.reason})` : ''}. Press Meetei Mayek again to finish them.`, true), 600);
  } catch (e) {
    msg({ cancelled: 'Stopped. Nothing was saved.', not_granted: 'Translation is not allowed here. In claude.ai allow Claude for this page; in the portal sign in again.', sampling_disabled: 'Claude is not available for this account.' }[e && e.code]
      || `Translation failed: ${errText(e)}. Nothing was saved. Try again in a minute; if it keeps failing, show this message to whoever looks after the portal.`);
  } finally {
    if (mmJob === job) { job.busy = false; const r = $('#mmRun'), s2 = $('#mmStop'); if (r) r.disabled = false; if (s2) s2.hidden = true; }
  }
}

function exportUnits(set) {
  const T = !!set.builtin, units = [], key = [];
  let n = 0, bid = 0, pending = [];
  const tx = (s, trusted) => trusted ? s : fmtU(s);
  const blk = (kind, html, data) => ({ id: ++bid, kind, html: mayekify(`<div class="p-b" data-b="${bid}">${html}</div>`), ...data });
  const flush = () => { if (pending.length) { units.push({ full: false, blocks: pending }); pending = []; } };
  const col = (b, glue) => { pending.push(b); if (!glue) flush(); };
  const full = (b) => { flush(); units.push({ full: true, blocks: [b] }); };
  const total = countQ(set), no = esc(String(set.setNo ?? 1));
  const words = esc(set.title || 'Model Question Paper').split(' ');
  const title = words.length > 1 ? `${words.slice(0, -1).join(' ')} <span>${words[words.length - 1]}</span>` : `<span>${words[0]}</span>`;
  full(blk('mast', `<div class="p-mast">${medal(set.setNo)}<div><div class="p-eb">Model Question Paper · Practice Set ${no}</div><h1>${title}</h1><div class="p-sub">${esc(set.subtitle || '')}</div>
    <div class="p-facts"><span><b>${total}</b> questions</span><span><b>${set.sections.length}</b> sections</span><span>${esc(dur(set.minutes))}</span><span>Medium: ${esc(set.medium || 'English')}</span></div></div></div>
    <div class="p-ins">${(set.labels && set.labels.ins || MM_INSTRUCTIONS).map(t => `<div>•&nbsp; ${esc(t)}</div>`).join('')}</div>`, { set }));
  set.sections.forEach((sec, si) => {
    const from = n + 1;
    if (sec.tag || sec.title || sec.dir) full(blk('band', `${sec.tag ? `<div class="p-tag">${tx(sec.tag, T)}</div>` : ''}${sec.title ? `<div class="p-bt">${tx(sec.title, T)}</div>` : ''}${sec.dir ? `<div class="p-bd">${T ? sec.dir : fmtDir(sec.dir)}</div>` : ''}`, { sec, T }));
    (sec.items || []).forEach(it => {
      if (it.t === 'head') {
        if (it.sub) col(blk('sub', `<div class="p-sh">${esc((T ? toText(it.sub) : it.sub).toUpperCase())}</div>`, { text: it.sub, T }), true);
        if (it.part) col(blk('part', `<div class="p-part">${tx(it.part, T)}</div>`, { text: it.part, T }), true);
        if (it.dir) col(blk('dir', `<p class="p-dir">${T ? it.dir : fmtDir(it.dir)}</p>`, { text: it.dir, T }), true);
        return;
      }
      if (it.t === 'passage') {
        if (it.title) col(blk('ptitle', `<div class="p-pt">${tx(it.title, T)}</div>`, { text: it.title, T }), true);

        return;
      }

      if (!q) return;
      key.push({ n, a: q.a, si });
      col(blk('q', printQ(q, n, trusted), { q, n, trusted }), false);
    });
    flush();
    sec._range = [from, n];
  });
  flush();
  return { units, key, total };
}

function paginate(units, s) {
  const G = 9 * s, GF = 12 * s;
  const pages = [[]];
  let y = 0, run = [];
  const page = () => pages[pages.length - 1];
  const newPage = () => { pages.push([]); y = 0; };
  const flushRun = () => {
    while (run.length) {
      const avail = BODY_H - y;
      const pre = [0];
      run.forEach((u, i) => pre.push(pre[i] + u.h + (i ? G : 0)));
      const total = pre[run.length];
      let best = -1, bestMax = Infinity;
      for (let k = run.length; k >= 0; k--) {          // from the top, so ties keep more in the left column
        const L = pre[k], R = k === run.length ? 0 : total - pre[k] - (k ? G : 0);
        if (L <= avail && R <= avail && Math.max(L, R) < bestMax) { bestMax = Math.max(L, R); best = k; }
      }
      if (best >= 0) { page().push({ type: 'cols', left: run.slice(0, best), right: run.slice(best), h: bestMax }); y += bestMax + GF; run = []; break; }
      const take = () => {
        const out = []; let h = 0;
        while (run.length) {
          const nh = h + (out.length ? G : 0) + run[0].h;
          if (nh > avail && (out.length || y > 0)) break;
          out.push(run.shift()); h = nh;
          if (h > avail) break;
        }
        return out;
      };
      const left = take();
      if (!left.length) { newPage(); continue; }
      const right = take();
      page().push({ type: 'cols', left, right, h: avail });
      newPage();
    }
  };
  units.forEach((u, ui) => {
    if (!u.full) { run.push(u); return; }
    flushRun();
    const kind = u.blocks[0].kind;
    // keep a section band with the first block after it
    const next = units[ui + 1], follow = kind === 'band' && next && !next.full ? next.h + GF : 0;
    if (y > 0 && (y + u.h > BODY_H || (kind === 'band' && y + u.h + Math.max(follow, 150 * s) > BODY_H))) newPage();
    page().push({ type: 'full', u }); y += u.h + GF;
  });
  flushRun();
  while (pages.length > 1 && !page().length) pages.pop();
  return pages;
}

const unitHTML = u => u.html || `<div class="p-u">${u.blocks.map(b => b.html).join('')}</div>`;

/* lays the set out in hidden A4 pages; returns the page elements and the scale that fits */
async function layoutPaper(set, maxPages, withKey) {
  if (!document.getElementById('ppcss')) { const st = document.createElement('style'); st.id = 'ppcss'; st.textContent = PRINT_CSS; document.head.append(st); }
  const root = document.createElement('div');
  root.className = 'pp';
  document.body.append(root);
  const { units, key, total } = exportUnits(set);
  root.innerHTML = `<div class="p-meas"><div class="p-mf" style="width:${FULL_W}px"></div><div class="p-mc" style="width:${COL_W}px"></div></div>`;
  const mf = root.querySelector('.p-mf'), mc = root.querySelector('.p-mc');
  units.forEach(u => { const t = document.createElement('div'); t.innerHTML = unitHTML(u); u.el = t.firstChild; (u.full ? mf : mc).append(u.el); });
  // pictures must be in (and loaded) before measuring, or a figure counts as 0 px tall and then
  // spills over the questions and section bands below it on the page
  await inlineImages(root);
  await Promise.all([...root.querySelectorAll('img')].map(i => i.complete ? null : new Promise(r => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); })));
  units.forEach(u => { if (u.el.querySelector('img')) u.html = u.el.outerHTML; });
  const measure = s => { root.style.setProperty('--s', s); units.forEach(u => { u.h = u.el.getBoundingClientRect().height; }); };
  const tryScale = s => { measure(s); return paginate(units, s); };
  let lo = 0.62, hi = 1.45, best;
  let p = tryScale(hi);
  if (p.length <= maxPages) best = { s: hi, pages: p };
  else {
    p = tryScale(lo);
    best = { s: lo, pages: p, over: p.length > maxPages };
    if (!best.over) for (let i = 0; i < 9; i++) {
      const mid = (lo + hi) / 2, pm = tryScale(mid);
      if (pm.length <= maxPages) { lo = mid; best = { s: mid, pages: pm }; } else hi = mid;
    }
  }
  measure(best.s);
  best.pages = paginate(units, best.s);
  const s = best.s, G = 9 * s, GF = 12 * s;
  const no = esc(String(set.setNo ?? 1));
  const head = `${esc(set.title || 'Model Paper')} · Practice Set – ${no}`;
  const count = best.pages.length + (withKey ? 1 : 0);
  const pageEl = (inner, i) => `<div class="p-pg"><div class="p-ph"><span>${head}</span><b>${no}-${i + 1}</b></div>${inner}
    <div class="p-pf"><span>${esc(set.subtitle || '')}</span><span>Page ${i + 1} of ${count}</span></div></div>`;
  let html = best.pages.map((regions, i) => pageEl(regions.map(r => r.type === 'full'
    ? `<div style="margin-bottom:${GF}px">${unitHTML(r.u)}</div>`
    : `<div class="p-reg" style="height:${r.h}px;margin-bottom:${GF}px"><div class="p-col" style="gap:${G}px">${r.left.map(unitHTML).join('')}</div><div class="p-col" style="gap:${G}px">${r.right.map(unitHTML).join('')}</div></div>`).join(''), i)).join('');
  if (withKey) {
    const bySec = set.sections.map((sec, si) => ({ name: sec.short || sec.title || sec.tag || `Section ${si + 1}`, rows: key.filter(k => k.si === si) })).filter(x => x.rows.length);
    html += pageEl(`<div class="p-key"><h2>Answer key</h2><div class="p-sub">${esc(set.title || '')} · Practice Set ${no}</div>
      ${bySec.map(g => `<h3>${esc(g.name)}</h3><div class="p-kg">${g.rows.map(k => `<span><i>${k.n}</i>${k.a != null ? LET[k.a] : '–'}</span>`).join('')}</div>`).join('')}</div>`, best.pages.length);
  }
  root.innerHTML = html;
  root.style.setProperty('--s', s);
  root.querySelectorAll('svg').forEach(inlineSvgStyles);
  return { root, pageEls: [...root.querySelectorAll('.p-pg')], s, over: !!best.over, units, key, total, count, withKey };
}

async function svgToPng(svg, w, h) {

async function drawPng(img, w, h) {

/* libraries: the portal hands over its own copies; elsewhere they load from the CDN */

async function loadLibs(fmt) {
  const lent = CL && typeof CL.exportLibs === 'function' ? await CL.exportLibs() : {};
  // html2canvas must run in THIS frame: a copy from the portal window draws on that window's canvas,
  // which cannot see this page's web fonts (Literata, BMEI04…) and falls back to system fonts.
  if (!window.html2canvas) await loadScript(lent.html2canvasUrl || LIB.html2canvas);
  if (fmt === 'pdf' && !lent.jsPDF && !window.jspdf) await loadScript(LIB.jspdf);
  if (fmt === 'docx' && !lent.docx && !window.docx) await loadScript(LIB.docx);

/* pictures from another site (the portal's storage) become data inside the page before drawing,

async function inlineImages(root) {
  const imgs = [...root.querySelectorAll('img')].filter(i => /^https?:/.test(i.getAttribute('src') || '') && new URL(i.src, location.href).origin !== location.origin);
  const cache = new Map();

    const url = img.getAttribute('src');

      if (!cache.has(url)) cache.set(url, get(url).catch(async e => { const alt = await portalImage(url); if (!alt) throw e; return get(alt); })

/* ---------- import: read a PDF (or photos) of a paper, detect the questions, rebuild them in this design ---------- */
const PDFJS = {
  lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',

const READ_PROMPT = (p, total) => `This image is page ${p} of ${total} of a printed exam paper (an Indian school entrance test such as the JNV Selection Test). Read it and list everything a student needs, in reading order: in a two-column page, the whole left column first, then the right column.

Reply with only JSON in this shape:
{"items": [
  {"type": "section", "tag": "Section 2", "title": "Arithmetic Test", "directions": "..."},
  {"type": "heading", "sub": "Mental Ability Test (MAT)", "part": "Part – I", "directions": "..."},
  {"type": "passage", "title": "...", "text": "paragraph one\\n\\nparagraph two"},
  {"type": "question", "number": 21, "text": "...", "options": ["...", "...", "...", "..."], "answer": null,
   "figure": [ymin, xmin, ymax, xmax], "optionFigures": [[...], [...], [...], [...]], "continued": false}
]}

Rules:
- Copy wording exactly. Write fractions as [a/b] (mixed numbers like 4[1/2]); keep ₹, °, × and ÷.
- "section" is a full-width band such as "SECTION–1 … DIRECTIONS …". "heading" is a part heading or a directions paragraph for a group of questions. Use "" for any field that is not printed.
- Leave out running headers, page numbers, page footers, logos and scissor/cut marks.
- Boxes are [ymin, xmin, ymax, xmax] on this page image, each from 0 to 1000. Draw them tightly around the drawing only, without the question number or the (A) (B) (C) (D) labels.
- "figure": one box around the question's figure, diagram, picture or table (all of a question's figures in one box), or null when there is none.
- "optionFigures": four boxes when the answer choices are pictures, else null. Then "options" is ["", "", "", ""].
- "answer": the index 0–3 of the correct option only when the page prints an answer key or the answer is certain from a simple fact or calculation; otherwise null.
- A question whose start is on the previous page: give only the part on this page, with "continued": true.
- If the page has no questions, reply {"items": []}.`;

const loadPdfJs = async () => {
  if (!window.pdfjsLib) await loadScript(PDFJS.lib);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS.worker;
  return window.pdfjsLib;
};
async function fileToPages(files, onMsg) {
  const pages = [];
  let total = 0;
  for (const file of files) {
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      onMsg('Opening the PDF…');
      const lib = await loadPdfJs();
      const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      total += doc.numPages;
      for (let i = 1; i <= doc.numPages && pages.length < IMPORT_MAX_PAGES; i++) {
        onMsg(`Preparing page ${pages.length + 1}…`);
        const page = await doc.getPage(i);
        const vp1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: PAGE_PX / vp1.width });
        const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
        await page.render({ canvasContext: g, viewport: vp }).promise;
        pages.push(cv);
      }
    } else if (/^image\//.test(file.type)) {
      total++;
      if (pages.length >= IMPORT_MAX_PAGES) continue;
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, PAGE_PX / bmp.width), cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(bmp, 0, 0, cv.width, cv.height);

}
const canvasBlob = (cv, type = 'image/jpeg', q = 0.86) => new Promise(r => cv.toBlob(r, type, q));
const blobB64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });

  if (t && typeof t === 'object') return t;
  const s = String(t || '').trim().replace(/^```(?:json)?\s*|\s*```$/g, '');
  try { return JSON.parse(s); } catch (e) { const a = s.indexOf('{'), b = s.lastIndexOf('}'); return a >= 0 && b > a ? JSON.parse(s.slice(a, b + 1)) : null; }
};
/* who reads the page: the portal's Gemini service, or Claude in the claude.ai viewer */
async function readerKind() {
  if (CL && typeof CL.visionJSON === 'function') return 'portal';
  if (S.sample) { const lim = await S.sample.limits().catch(() => null); if (lim && lim.images) return 'claude'; }

  if (kind === 'portal') return parseLooseJSON(await CL.visionJSON(prompt, [{ mimeType: 'image/jpeg', data: await blobB64(blob) }]));

        if (it.optFigs) for (const c of it.optFigs) q.optImgs.push(await save(c));
        if (it.fig) { const fr = await from(it.fig); if (fr) q.imgFrom = fr; }
        if (it.optFigs) { const fr = []; for (const c of it.optFigs) fr.push(await from(c)); if (fr.some(Boolean)) q.optFrom = fr; }
      }
      built.push(q);
    }
    let set, si;
    if (imp.mode === 'new') { set = blankSet(nextNo()); set.sections = []; si = -1; }
    else { set = cur.draft; si = cur.sec; }
    const target = () => {
      if (si < 0 || !set.sections[si]) { set.sections.push({ tag: `Section ${set.sections.length + 1}`, title: '', short: '', dir: DIR_MCQ, items: [] }); si = set.sections.length - 1; }
      return set.sections[si];
    };
    built.forEach(it => {
      if (it.t === 'section') { set.sections.push({ tag: it.tag || `Section ${set.sections.length + 1}`, title: it.title, short: '', dir: it.dir, items: [] }); si = set.sections.length - 1; return; }
      target().items.push(it);
    });
    if (imp.mode === 'new') {
      if (!set.sections.length) target();
      nextDraft = set;
      try { await saveSet(set); } catch (e) { /* the maker shows the save state */ }
      imp = null; ov.innerHTML = '';
      go('edit-' + set.id);
    } else {
      imp = null; ov.innerHTML = '';
      dirty(true);
    }
  } catch (e) {
    msg(e && e.code === 'too_large' ? 'A figure was too large to save.' : 'Could not save the figures. Check the connection and try again.');
    if (imp) { imp.busy = false; const b = $('#impAdd'); if (b) b.disabled = false; }
  }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const jump = e.target.closest('[data-jump]');
  if (jump) { const t = document.getElementById('q' + jump.dataset.jump); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (cur.view === 'take') {
    const b = e.target.closest('.opt, .ob');
    if (b && !cur.checked) {
      const q = +b.dataset.q, o = +b.dataset.o;
      if (cur.ans[q] === o) delete cur.ans[q]; else cur.ans[q] = o;
      cur.save(); paint(); return;
    }
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'new') { const s = blankSet(nextNo()); nextDraft = s; try { await saveSet(s); } catch (err) {} go('edit-' + s.id); }
  else if (act === 'dup') {
    const src = getSet(a.dataset.id); if (!src) return;
    const s = editableCopy(src); s.id = newId(); s.setNo = nextNo();
    if (!src.builtin) s.title = src.title;
    nextDraft = s; try { await saveSet(s); } catch (err) {} go('edit-' + s.id);
  }
  else if (act === 'del') {
    if (!a.classList.contains('armed')) { a.classList.add('armed'); a.textContent = 'Tap to delete'; setTimeout(() => { if (a.isConnected) { a.classList.remove('armed'); a.textContent = 'Delete'; } }, 3000); return; }
    a.disabled = true; try { await deleteSet(a.dataset.id); } catch (err) { a.textContent = 'Could not delete'; }
  }
  else if (act === 'timer') {
    const btn = $('#timerBtn');
    if (tick) { stopTimer(); btn.textContent = 'Resume'; return; }
    btn.textContent = 'Pause';
    tick = setInterval(() => {
      left = Math.max(0, left - 1); const c = $('#clock'); if (c) c.textContent = fmtT(left);
      if (!left) { stopTimer(); btn.textContent = 'Done'; btn.disabled = true; if (!cur.checked) toggleCheck(); }
    }, 1000);
  }
  else if (act === 'check') toggleCheck();
  else if (act === 'clear') {
    if (!a.classList.contains('armed')) { a.classList.add('armed'); a.textContent = 'Tap again to clear'; setTimeout(() => { if (a.isConnected) { a.classList.remove('armed'); a.textContent = 'Clear all'; } }, 2500); return; }
    cur.ans = {}; cur.checked = false; cur.save(); a.classList.remove('armed'); a.textContent = 'Clear all'; paint();
  }
  else if (act === 'export') { openExport(a.dataset.id); return; }
  else if (act === 'ovclose') {
    if (e.target === a || a.tagName === 'BUTTON') {
      if (exportBusy || (imp && imp.busy && imp.items)) return;     // a file is being written or figures saved
      if (imp && imp.ctl) imp.ctl.abort();
      if (mmJob && mmJob.ctl) mmJob.ctl.abort();
      imp = null; mmJob = null; ov.innerHTML = '';
    }
    return;
  }
  else if (act === 'import') { if (a.dataset.mode === 'add' && cur.view !== 'maker') return; openImport(a.dataset.mode === 'add' ? 'add' : 'new'); return; }
  else if (act === 'impread') { runImport(); return; }
  else if (act === 'mm') { openTranslate(a.dataset.id); return; }
  else if (act === 'mmrun') { runTranslate(); return; }
  else if (act === 'mmstop') { if (mmJob && mmJob.ctl) mmJob.ctl.abort(); return; }
  else if (act === 'impstop') { if (imp && imp.ctl) imp.ctl.abort(); return; }
  else if (act === 'impadd') { finishImport(); return; }
  else if (act === 'impcrop') { e.preventDefault(); openCrop(+a.dataset.i, a.dataset.k); return; }
  else if (act === 'expdf') { runExport('pdf'); return; }
  else if (act === 'exdocx') { runExport('docx'); return; }
  if (cur.view !== 'maker') return;
  const d = cur.draft, sec = d.sections[cur.sec];
  const card = a.closest('[data-i]'), ii = card ? +card.dataset.i : -1, items = sec ? sec.items : [];
  if (act === 'pane') {
    document.querySelectorAll('.mk-tabs .tab').forEach(t => t.setAttribute('aria-selected', t === a));
    $('#mkEdit').hidden = a.dataset.p !== 'edit'; $('#mkPrevWrap').hidden = a.dataset.p !== 'prev';
    if (a.dataset.p === 'prev') renderPreview();
  }
  else if (act === 'sec') { cur.sec = +a.dataset.s; renderEditor(); }
  else if (act === 'addsec') { d.sections.push({ tag: `Section ${d.sections.length + 1}`, title: 'New Section', short: '', dir: DIR_MCQ, items: [] }); cur.sec = d.sections.length - 1; dirty(true); }
  else if (act === 'secl' || act === 'secr') {
    const j = cur.sec + (act === 'secl' ? -1 : 1); if (j < 0 || j >= d.sections.length) return;
    [d.sections[cur.sec], d.sections[j]] = [d.sections[j], d.sections[cur.sec]]; cur.sec = j; dirty(true);
  }
  else if (act === 'delsec') {
    if (!a.classList.contains('armed')) { a.classList.add('armed'); a.textContent = `Delete with ${(sec.items || []).length} items?`; return; }
    d.sections.splice(cur.sec, 1); cur.sec = Math.max(0, cur.sec - 1); dirty(true);
  }
  else if (act === 'recrop') { if (S.canWrite && ii >= 0) recrop(items[ii], a.dataset.f, card, ii); return; }
  else if (act === 'add') {
    const k = a.dataset.k;
    const it = k === 'q' ? { t: 'q', kind: 'text', q: '', opts: ['', '', '', ''], a: null }
      : k === 'img' ? { t: 'q', kind: 'img', q: '', img: '', optMode: 'img', optImgs: ['', '', '', ''], opts: ['', '', '', ''], a: null }
      : k === 'passage' ? { t: 'passage', title: '', text: '' } : { t: 'head', sub: '', part: '', dir: '' };
    items.push(it); dirty(true);
    const last = $('#mkEdit .items').lastElementChild; if (last) { last.scrollIntoView({ behavior: 'smooth', block: 'center' }); const f = last.querySelector('textarea, input.in'); if (f) f.focus({ preventScroll: true }); }
  }
  else if (act === 'up' || act === 'down') {
    const j = ii + (act === 'up' ? -1 : 1); if (j < 0 || j >= items.length) return;
    [items[ii], items[j]] = [items[j], items[ii]]; dirty(true);
  }
  else if (act === 'copy') { items.splice(ii + 1, 0, clone(items[ii])); dirty(true); }
  else if (act === 'rm') {
    if (!a.classList.contains('armed')) { a.classList.add('armed'); a.title = 'Tap again to remove'; setTimeout(() => a.isConnected && a.classList.remove('armed'), 2500); return; }
    items.splice(ii, 1); dirty(true);
  }
  else if (act === 'bank') openBank();
  else if (act === 'bankclose') { if (e.target === a || a.tagName === 'BUTTON') ov.innerHTML = ''; }
  else if (act === 'bankadd') {
    const refs = [...ov.querySelectorAll('input:checked')].map(i => +i.value);
    ov.innerHTML = '';
    if (refs.length) { refs.forEach(r => items.push(fromBank(r))); dirty(true); }
  }
  else if (act === 'gen') { cur.gen = !cur.gen; const g = $('#gen'); if (g) { g.hidden = !cur.gen; if (cur.gen) $('#genTopic').focus(); } }
  else if (act === 'genrun') generate();
  else if (act === 'genstop') genCtl && genCtl.abort();
});

document.addEventListener('input', e => {
  if (cur.view !== 'maker') return;
  const el = e.target, f = el.dataset && el.dataset.f; if (!f || el.type === 'file') return;
  const d = cur.draft;
  if (el.closest('[data-scope="meta"]')) { d[f] = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value; return dirty(false); }
  if (el.closest('[data-scope="sec"]')) {
    d.sections[cur.sec][f] = el.value;
    if (f === 'tag') { const t = document.querySelector(`.tab[data-s="${cur.sec}"]`), ct = t && t.querySelector('.ct'); if (t) t.innerHTML = mayekify(esc(el.value || `Section ${cur.sec + 1}`)) + (ct ? ct.outerHTML : ''); }
    return dirty(false);
  }
  const card = el.closest('[data-i]'); if (!card) return;
  const it = d.sections[cur.sec].items[+card.dataset.i];
  if (f === 'a') { it.a = +el.value; const w = card.querySelector('.chip.warn'); if (w && !it.gen) w.remove(); }
  else if (f === 'optMode') { it.optMode = el.checked ? 'img' : 'text'; return dirty(true); }
  else if (/^o\d$/.test(f)) { it.opts = it.opts || ['', '', '', '']; it.opts[+f[1]] = el.value; }
  else it[f] = el.value;
  dirty(false);
});

document.addEventListener('change', async e => {
  if (cur.view !== 'maker') return;
  const el = e.target, f = el.dataset && el.dataset.f;
  if (!f || el.type !== 'file' || !el.files || !el.files[0]) return;
  const card = el.closest('[data-i]'); if (!card) return;
  const it = cur.draft.sections[cur.sec].items[+card.dataset.i];
  const msg = card.querySelector('[data-msg]'); if (msg) msg.textContent = 'Uploading…';
  try {
    const ref = await storeImage(el.files[0]);
    if (f === 'img') { it.img = ref; delete it.imgFrom; }
    else { it.optImgs = it.optImgs || ['', '', '', '']; it.optImgs[+f.slice(4)] = ref; if (it.optFrom) it.optFrom[+f.slice(4)] = null; }
    dirty(true);
  } catch (err) {
    if (msg) msg.textContent = err && err.code === 'too_large' ? 'That image is too large.' : 'Could not add that image. Try a PNG or JPEG.';
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !ov.innerHTML || exportBusy || (imp && imp.busy && imp.items)) return;
  if (imp && imp.ctl) imp.ctl.abort();
  if (mmJob && mmJob.ctl) mmJob.ctl.abort();
  imp = null; mmJob = null; ov.innerHTML = '';
});
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', flushSave);

route();
initCaps();
})();
</script>
</body></html>
